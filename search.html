<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VORTEX — البحث المتقدم">
    <title>VORTEX — البحث</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body data-page="search">

    <div id="app-header"></div>

    <main>
        <div class="container">

            <div class="page-title">
                <h1>البحث المتقدم</h1>
                <p>ابحث بالاسم، أو صفّ النتائج بالتصنيف والنوع والحالة.</p>
            </div>

            <div class="search-bar">
                <input id="q" type="search" placeholder="اسم العمل...">
                <button id="filters-toggle" type="button" class="btn secondary" aria-expanded="false"></button>
                <button id="search-btn" type="button" class="btn primary"></button>
            </div>

            <div id="filters" class="filters hidden"></div>

            <div class="results-header">
                <h2 id="results-title">الأعمال</h2>
                <div style="display:flex;gap:14px;align-items:center">
                    <span id="results-count" class="results-count"></span>
                    <button id="clear-btn" type="button" class="text-button hidden">مسح الفلاتر</button>
                </div>
            </div>

            <div id="results" class="manga-grid"></div>

        </div>
    </main>

    <div id="app-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>
    <script src="js/taxonomy.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
