<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — البحث عن المانجا"
    >

    <title>VORTEX — البحث</title>

    <!-- التصميم الأساسي -->
    <link rel="stylesheet" href="css/core.css">

</head>


<body data-page="search">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="app-header"></div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <div class="container">


            <!-- =====================================
                 PAGE HEADER
            ====================================== -->

            <section class="page-title">

                <span class="eyebrow">
                    VORTEX
                </span>

                <h1>
                    البحث
                </h1>

                <p>
                    ابحث عن المانجا أو المانهوا أو الويب تون
                    التي تريد قراءتها.
                </p>

            </section>


            <!-- =====================================
                 SEARCH FORM
            ====================================== -->

            <section class="search-panel">

                <form
                    id="search-form"
                    class="search-box"
                >

                    <div class="search-input-wrapper">

                        <span
                            class="search-icon"
                            aria-hidden="true"
                        >
                            ⌕
                        </span>

                        <input
                            id="search-input"
                            type="search"
                            name="q"
                            placeholder="اكتب اسم العمل..."
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="البحث عن مانجا"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn primary"
                    >
                        بحث
                    </button>

                </form>

            </section>


            <!-- =====================================
                 SEARCH INFORMATION
            ====================================== -->

            <section
                id="search-info"
                class="results-header"
                style="display:none;"
            >

                <div>

                    <span class="eyebrow">
                        نتائج البحث
                    </span>

                    <h2 id="search-query">
                        النتائج
                    </h2>

                </div>


                <span
                    id="search-count"
                    class="results-count"
                >
                    0 نتيجة
                </span>

            </section>


            <!-- =====================================
                 SEARCH RESULTS
            ====================================== -->

            <section>

                <div
                    id="search-results"
                    class="manga-grid"
                >

                    <!--
                        النتائج ستُضاف بواسطة JavaScript
                    -->

                </div>


                <!-- =================================
                     INITIAL STATE
                ================================== -->

                <div
                    id="search-empty"
                    class="empty"
                >

                    <div class="empty-icon">
                        ⌕
                    </div>

                    <h3>
                        ابحث عن عمل
                    </h3>

                    <p>
                        اكتب اسم المانجا في مربع البحث
                        لعرض النتائج.
                    </p>

                </div>


                <!-- =================================
                     NO RESULTS
                ================================== -->

                <div
                    id="no-results"
                    class="empty hidden"
                >

                    <div class="empty-icon">
                        ◌
                    </div>

                    <h3>
                        لا توجد نتائج
                    </h3>

                    <p>
                        لم نعثر على عمل يطابق بحثك.
                        جرّب كلمة مختلفة.
                    </p>

                </div>


                <!-- =================================
                     LOADING
                ================================== -->

                <div
                    id="search-loading"
                    class="empty"
                    style="display:none;"
                >

                    <div class="loading-spinner"></div>

                    <p>
                        جارٍ البحث...
                    </p>

                </div>


            </section>


        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="app-footer"></div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/core.js"></script>


    <script>

        /*
         * =========================================
         * SEARCH PAGE
         * =========================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const form =
                    document.getElementById(
                        "search-form"
                    );

                const input =
                    document.getElementById(
                        "search-input"
                    );

                const results =
                    document.getElementById(
                        "search-results"
                    );

                const initialState =
                    document.getElementById(
                        "search-empty"
                    );

                const noResults =
                    document.getElementById(
                        "no-results"
                    );

                const loading =
                    document.getElementById(
                        "search-loading"
                    );

                const info =
                    document.getElementById(
                        "search-info"
                    );

                const queryLabel =
                    document.getElementById(
                        "search-query"
                    );

                const countLabel =
                    document.getElementById(
                        "search-count"
                    );


                /*
                 * -----------------------------------------
                 * READ QUERY FROM URL
                 * -----------------------------------------
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const urlQuery =
                    params.get("q");


                if (urlQuery) {

                    input.value = urlQuery;

                    performSearch(urlQuery);

                }


                /*
                 * -----------------------------------------
                 * FORM SUBMIT
                 * -----------------------------------------
                 */

                form.addEventListener(
                    "submit",
                    (event) => {

                        event.preventDefault();

                        const query =
                            input.value.trim();


                        if (!query) {

                            results.innerHTML = "";

                            info.style.display =
                                "none";

                            noResults.classList.add(
                                "hidden"
                            );

                            loading.style.display =
                                "none";

                            initialState.classList.remove(
                                "hidden"
                            );

                            return;

                        }


                        /*
                         * Update URL
                         */

                        const newURL =
                            new URL(
                                window.location.href
                            );

                        newURL.searchParams.set(
                            "q",
                            query
                        );

                        window.history.replaceState(
                            {},
                            "",
                            newURL
                        );


                        performSearch(query);

                    }
                );


                /*
                 * -----------------------------------------
                 * SEARCH FUNCTION
                 * -----------------------------------------
                 */

                async function performSearch(query) {

                    results.innerHTML = "";

                    initialState.classList.add(
                        "hidden"
                    );

                    noResults.classList.add(
                        "hidden"
                    );

                    loading.style.display =
                        "block";


                    info.style.display =
                        "none";


                    try {

                        const data =
                            await VortexAPI.search(
                                query
                            );


                        loading.style.display =
                            "none";


                        info.style.display =
                            "flex";


                        queryLabel.textContent =
                            `نتائج: ${query}`;


                        countLabel.textContent =
                            `${data.length} نتيجة`;


                        if (
                            !data ||
                            data.length === 0
                        ) {

                            noResults.classList.remove(
                                "hidden"
                            );

                            return;

                        }


                        /*
                         * Render cards
                         */

                        renderMangaGrid(
                            data,
                            results
                        );


                    } catch (error) {

                        console.error(
                            "VORTEX search error:",
                            error
                        );


                        loading.style.display =
                            "none";


                        info.style.display =
                            "none";


                        results.innerHTML = "";


                        noResults.classList.remove(
                            "hidden"
                        );

                    }

                }

            }
        );

    </script>


</body>

  </html>
