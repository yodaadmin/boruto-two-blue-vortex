<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">
<title>قارئ الفصل — دوامتان زرقاوتان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reader.css">
</head>
<body class="reader-page">
<header class="reader-bar">
  <a class="reader-back" href="index.html#chapters">‹ الفصول</a>
  <div class="reader-title"><span id="mangaName">دوامتان زرقاوتان</span><b id="chapterName">الفصل</b></div>
  <div class="reader-actions">
    <button id="settingsBtn" class="rbtn" title="إعدادات القراءة">⚙</button>
    <button id="fullscreenBtn" class="rbtn" title="ملء الشاشة">⛶</button>
  </div>
</header>

<div id="settings" class="settings-panel" hidden>
  <div class="settings-head"><b>إعدادات القراءة</b><button id="closeSettings" class="close">×</button></div>
  <label>نمط العرض
    <select id="readerMode"><option value="vertical">تمرير عمودي</option><option value="single">صفحة واحدة</option><option value="double">صفحتان</option></select>
  </label>
  <label>حجم العرض
    <select id="fitMode"><option value="width">ملاءمة العرض</option><option value="original">الحجم الأصلي</option><option value="height">ملاءمة الارتفاع</option></select>
  </label>
  <label>لون الخلفية
    <select id="readerBg"><option value="dark">داكن</option><option value="black">أسود</option><option value="light">فاتح</option><option value="blue">أزرق داكن</option></select>
  </label>
  <label class="check"><input id="rtlMode" type="checkbox" checked> قراءة من اليمين إلى اليسار</label>
  <label class="check"><input id="rememberPos" type="checkbox" checked> تذكر آخر موضع</label>
</div>

<main id="reader" class="reader-canvas"></main>
<div id="bottomNav" class="reader-bottom"></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script><script src="reader.js"></script>
</body>
</html>
