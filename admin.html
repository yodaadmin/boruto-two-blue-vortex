<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخيص رفع الصفحات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#07111b;color:#edf5fb;font-family:system-ui,Tahoma,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#0d1b27;border:1px solid #203747;border-radius:18px;padding:18px;margin:14px 0}input,button{font:inherit}input{width:100%;padding:11px;margin:7px 0 12px;background:#08131d;color:white;border:1px solid #2a4557;border-radius:10px}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}.primary{background:#36a9e8;color:#041019;font-weight:800}.ghost{background:#172a38;color:#fff}.msg{white-space:pre-wrap;background:#08141f;border:1px solid #203747;border-radius:10px;padding:12px;margin-top:12px;line-height:1.7}.hidden{display:none!important}
</style></head><body><main class="wrap">
<div class="card"><h1>تشخيص رفع الصفحات</h1><p>هذه نسخة مؤقتة لتحديد هل RLS يمنع Storage أم جدول pages.</p></div>
<section id="login" class="card"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginBtn" class="primary">دخول</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="card hidden"><h2>اختبار صفحة واحدة</h2><p>اختر صورة واحدة فقط.</p><button id="find" class="ghost">تحميل الفصل 1</button><div id="chapterMsg" class="msg"></div><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="test" class="primary">اختبار الرفع</button><div id="msg" class="msg"></div><button id="logout" class="ghost">خروج</button></section>
</main><script>
const URL="https://smgvqaunvvkbwkkgmccx.supabase.co",KEY="sb_publishable_S7Wd8d7OGc1m7bsHY4Awnw_ToSxY_j6",db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),say=(id,t)=>$(id).textContent=t;
async function boot(){const {data}=await db.auth.getSession();if(data.session){login.classList.add("hidden");app.classList.remove("hidden");say("msg","✅ تسجيل الدخول موجود.");}}
loginBtn.onclick=async()=>{say("loginMsg","جاري الدخول...");const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return say("loginMsg","❌ "+r.error.message);login.classList.add("hidden");app.classList.remove("hidden");say("msg","✅ تم تسجيل الدخول.");};
logout.onclick=async()=>{await db.auth.signOut();location.reload()};
find.onclick=async()=>{const r=await db.from("chapters").select("id,number,title").eq("number",1).maybeSingle();if(r.error)return say("chapterMsg","❌ chapters: "+r.error.message);if(!r.data)return say("chapterMsg","❌ الفصل 1 غير موجود.");chapterMsg.dataset.id=r.data.id;say("chapterMsg","✅ الفصل 1 موجود\\nID: "+r.data.id+"\\n"+(r.data.title||""));};
test.onclick=async()=>{const f=file.files[0],cid=chapterMsg.dataset.id;if(!f)return say("msg","❌ اختر صورة.");if(!cid)return say("msg","❌ اضغط تحميل الفصل 1.");const s=await db.auth.getSession();if(!s.data.session)return say("msg","❌ لا توجد جلسة.");say("msg","1) اختبار Storage...");const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=cid+"/diagnostic-"+Date.now()+"."+ext;const u=await db.storage.from("manga-pages").upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});if(u.error)return say("msg","❌ STORAGE FAILED\\n\\n"+u.error.message+"\\n\\nالمشكلة في storage.objects.");say("msg","✅ STORAGE OK\\n\\n2) اختبار pages...");const m=await db.from("pages").select("page_number").eq("chapter_id",cid).order("page_number",{ascending:false}).limit(1),next=(m.data?.[0]?.page_number||0)+1,i=await db.from("pages").insert({chapter_id:cid,page_number:next,storage_path:path});if(i.error)return say("msg","✅ STORAGE OK\\n❌ PAGES FAILED\\n\\n"+i.error.message+"\\n\\nالمشكلة في جدول pages.");say("msg","🎉 نجح الاختبار!\\n\\nStorage: OK\\npages: OK\\nالصفحة: "+next);};
boot();
</script></body></html>
