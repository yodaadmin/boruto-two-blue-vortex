<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050708">
<title>VORTEX — قارئ الفصل</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050708;
  --bar:#070a0cf2;
  --surface:#0b1013;
  --surface2:#10171a;
  --line:#202b30;
  --line2:#2a3940;
  --text:#f5f8f9;
  --muted:#8e9ba1;
  --cyan:#13abd2;
  --cyan2:#76e5fd;
  --danger:#ff8795;
  --reader-width:100%;
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth;
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  overflow-x:hidden
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(
      circle at 50% -15%,
      #13abd214,
      transparent 38%
    ),
    linear-gradient(
      120deg,
      transparent 0 37%,
      #ffffff07 37.15% 37.3%,
      transparent 37.45% 100%
    )
}

button,
select{
  font:inherit
}

button{
  cursor:pointer
}


/* =========================================================
   TOP BAR
========================================================= */

.bar{
  position:sticky;
  top:0;
  z-index:100;
  height:68px;

  display:grid;
  grid-template-columns:
    1fr
    minmax(180px,1.6fr)
    1fr;

  align-items:center;
  gap:12px;

  padding:8px 14px;

  background:var(--bar);
  border-bottom:1px solid #1c262a;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px)
}

.brand-back{
  justify-self:start;

  display:flex;
  align-items:center;
  gap:9px;

  color:#dfe7e9;
  text-decoration:none;

  font-size:13px;
  font-weight:850;

  padding:8px 11px;

  border:1px solid #263136;
  border-radius:11px;

  background:#0b0f11;

  transition:.2s
}

.brand-back:hover{
  border-color:#13abd277;
  color:var(--cyan2);
  transform:translateY(-1px)
}

.brand-mark{
  width:28px;
  height:28px;

  object-fit:contain;
  border-radius:50%;

  background:#050505
}

.title{
  min-width:0;
  text-align:center;

  display:flex;
  flex-direction:column;
  align-items:center;

  line-height:1.15
}

.title span{
  font-size:8px;
  letter-spacing:.22em;
  color:#728087;
  font-weight:850
}

.title b{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  margin-top:3px
}

.controls{
  justify-self:end;
  display:flex;
  gap:7px
}

.icon-btn{
  width:40px;
  height:40px;

  border:1px solid #263136;
  border-radius:11px;

  background:#0b0f11;
  color:#eaf1f3;

  font-size:18px;

  transition:.2s
}

.icon-btn:hover,
.icon-btn:focus-visible{
  border-color:#13abd277;
  color:var(--cyan2);
  box-shadow:0 0 24px #13abd214;
  outline:none
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{
  position:absolute;
  inset:auto 0 0 0;

  height:2px;

  background:transparent;
  overflow:hidden
}

.progress i{
  display:block;

  width:0;
  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      var(--cyan2)
    );

  box-shadow:0 0 12px #13abd288;

  transition:width .12s linear
}


/* =========================================================
   READER
========================================================= */

.reader{
  width:100%;
  min-height:calc(100vh - 68px);
  padding-bottom:24px
}

.page-wrap{
  width:100%;

  line-height:0;
  text-align:center;

  margin:0;
  padding:0;

  background:#000
}

.reader img{
  display:block;

  width:var(--reader-width);
  max-width:100%;

  height:auto;

  margin:0 auto;
  padding:0;

  border:0;

  box-shadow:none;

  user-select:none;
  -webkit-user-drag:none;

  line-height:0
}


/* =========================================================
   SINGLE PAGE MODE
========================================================= */

body.single .page-wrap{
  display:none
}

body.single .page-wrap.active{
  display:block;

  padding:12px 10px;

  background:transparent
}

.single .reader img{
  width:auto;

  max-width:100%;
  max-height:calc(100vh - 130px);

  object-fit:contain;

  margin:0 auto;

  border-radius:6px;

  box-shadow:0 24px 80px #000b
}


/* =========================================================
   STATUS
========================================================= */

.status{
  padding:80px 20px;

  text-align:center;

  color:var(--muted);

  max-width:760px;

  margin:auto;

  line-height:1.9
}

.status::before{
  content:"";

  display:block;

  width:58px;
  height:58px;

  margin:0 auto 20px;

  background:
    url("assets/vortex-mark-cyan.png")
    center/contain
    no-repeat;

  filter:drop-shadow(
    0 0 18px #13abd244
  );

  animation:spin 5s linear infinite
}

.status.error{
  color:#ffb0b9
}

.status h3{
  margin:0 0 8px;
  color:#fff
}


/* =========================================================
   OLD BOTTOM NAVIGATION
   REMOVED COMPLETELY
========================================================= */

.bottom{
  display:none!important
}


/* =========================================================
   CHAPTER SELECT MENU
   يظهر فقط عند الضغط على زر الفصول
========================================================= */

.chapter-jump{
  position:fixed;

  left:50%;
  bottom:78px;

  transform:
    translate(-50%,12px);

  z-index:85;

  width:min(
    420px,
    calc(100vw - 24px)
  );

  opacity:0;

  pointer-events:none;

  transition:.2s
}

.chapter-jump.open{
  opacity:1;

  transform:
    translate(-50%,0);

  pointer-events:auto
}

.chapter-jump select{
  width:100%;

  padding:13px 14px;

  border:1px solid #2b3940;
  border-radius:13px;

  background:#0a0f11f5;

  color:#f2f6f7;

  outline:none;

  box-shadow:0 18px 60px #000b
}

.chapter-jump small{
  display:block;

  margin-top:6px;

  text-align:center;

  color:#7d8b91;

  font-size:10px
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-backdrop{
  position:fixed;
  inset:0;

  z-index:120;

  background:#0009;

  backdrop-filter:blur(8px);

  opacity:0;

  pointer-events:none;

  transition:.2s
}

.settings-backdrop.open{
  opacity:1;
  pointer-events:auto
}

.settings{
  position:fixed;

  z-index:130;

  top:50%;
  left:50%;

  width:min(
    430px,
    calc(100vw - 24px)
  );

  max-height:
    min(
      680px,
      calc(100vh - 32px)
    );

  overflow:auto;

  transform:
    translate(
      -50%,
      calc(-50% + 16px)
    );

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      145deg,
      #0c1215,
      #080c0e
    );

  border:1px solid #2b3940;

  border-radius:20px;

  box-shadow:
    0 30px 100px #000d;

  padding:18px;

  transition:.22s
}

.settings.open{
  opacity:1;

  transform:
    translate(
      -50%,
      -50%
    );

  pointer-events:auto
}

.settings-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:18px
}

.settings-head h2{
  font-size:20px;
  margin:0
}

.settings-head p{
  margin:4px 0 0;

  color:#78878d;

  font-size:11px
}

.close{
  width:36px;
  height:36px;

  border:1px solid #29353a;

  border-radius:10px;

  background:#0b1012;

  color:#dfe7e9;

  font-size:18px
}

.setting{
  padding:14px 0;

  border-top:1px solid #1c282d
}

.setting:first-of-type{
  border-top:0
}

.setting label{
  display:block;

  color:#dfe7e9;

  font-size:13px;

  font-weight:850;

  margin-bottom:10px
}

.choices{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px
}

.choice{
  border:1px solid #26343a;

  background:#0b1012;

  color:#aebbc0;

  border-radius:11px;

  padding:11px 9px;

  text-align:center;

  transition:.2s
}

.choice.active{
  border-color:#13abd2aa;

  background:#0d2026;

  color:#76e5fd;

  box-shadow:
    inset 0 0 0 1px #13abd233
}

.setting-note{
  font-size:10px;

  color:#6f7d83;

  line-height:1.7;

  margin:8px 0 0
}

.range-row{
  display:flex;

  gap:8px;

  align-items:center
}

.range-row input{
  width:100%;

  accent-color:var(--cyan)
}

.range-value{
  min-width:45px;

  text-align:center;

  color:var(--cyan2);

  font-size:12px;

  font-weight:850
}

.setting-actions{
  display:flex;

  gap:8px;

  margin-top:6px
}

.setting-actions button{
  flex:1;

  border:1px solid #28363b;

  border-radius:11px;

  padding:11px;

  background:#101619;

  color:#edf4f6;

  font-weight:800
}

.setting-actions button.primary{
  background:var(--cyan);

  border-color:transparent;

  color:#031015
}


/* =========================================================
   END OF CHAPTER
   يظهر فقط أسفل الفصل
========================================================= */

.chapter-end{
  width:min(
    760px,
    calc(100% - 24px)
  );

  margin:34px auto 0;

  padding:28px 18px;

  border:1px solid #202d32;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #0b1012,
      #080b0d
    );

  text-align:center
}

.chapter-end .eyebrow{
  color:var(--cyan2);

  font-size:9px;

  font-weight:900;

  letter-spacing:.2em
}

.chapter-end h3{
  margin:8px 0 4px;

  font-size:18px
}

.chapter-end p{
  margin:0 0 18px;

  color:#7e8c92;

  font-size:11px
}

.chapter-end-actions{
  display:flex;

  gap:8px;

  justify-content:center;

  flex-wrap:wrap
}

.chapter-end button{
  border:1px solid #2b383d;

  background:#101619;

  color:#e8eff1;

  border-radius:11px;

  padding:10px 14px;

  font-weight:800
}

.chapter-end button.primary{
  background:var(--cyan);

  border-color:transparent;

  color:#031015
}

.chapter-end button:disabled{
  opacity:.45
}


/* =========================================================
   TOOLBAR
   PERMANENT — NO HIDE FEATURE
========================================================= */

body.toolbar-hidden .bar{
  display:grid!important;
  visibility:visible!important;
  opacity:1!important;
  transform:none!important;
  pointer-events:auto!important
}

.toolbar-recovery{
  display:none;

  position:fixed;

  top:10px;
  right:10px;

  z-index:9999;

  border:1px solid #2b3940;

  background:#0a0f11ee;

  color:#76e5fd;

  border-radius:11px;

  padding:9px 12px;

  font-weight:800;

  box-shadow:0 15px 45px #000b
}


/* =========================================================
   PAGE WHEEL
========================================================= */

.page-wheel{
  position:fixed;

  right:10px;
  top:50%;

  transform:translateY(-50%);

  z-index:95;

  width:34px;

  height:min(46vh,430px);

  min-height:220px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:space-between;

  padding:7px 0;

  border:1px solid #26363c;

  border-radius:18px;

  background:#080d0ff0;

  backdrop-filter:blur(16px);

  -webkit-backdrop-filter:blur(16px);

  box-shadow:0 18px 55px #000a
}

.wheel-btn{
  width:27px;
  height:27px;

  border:1px solid #26363c;

  border-radius:50%;

  background:#0d1417;

  color:#dfe9ec;

  font-size:13px;

  line-height:1;

  display:grid;

  place-items:center;

  padding:0;

  transition:.18s
}

.wheel-btn:hover,
.wheel-btn:focus-visible{
  border-color:#13abd277;

  color:var(--cyan2);

  outline:none;

  box-shadow:0 0 18px #13abd222
}

.wheel-track{
  position:relative;

  flex:1;

  width:12px;

  margin:6px 0;

  cursor:pointer;

  border:1px solid #223238;

  border-radius:999px;

  background:#0c1316;

  box-shadow:
    inset 0 0 0 1px #0008;

  touch-action:none
}

.wheel-fill{
  position:absolute;

  left:2px;
  right:2px;

  bottom:2px;

  height:0;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      var(--cyan2),
      var(--cyan)
    );

  box-shadow:0 0 12px #13abd255;

  pointer-events:none
}

.wheel-thumb{
  position:absolute;

  left:50%;
  top:2px;

  transform:
    translate(-50%,-50%);

  width:22px;
  height:22px;

  border-radius:50%;

  border:2px solid #76e5fd;

  background:#081014;

  box-shadow:
    0 0 0 4px #13abd21c,
    0 4px 18px #000b;

  cursor:grab;

  touch-action:none;

  z-index:2
}

.wheel-thumb:active{
  cursor:grabbing;

  transform:
    translate(-50%,-50%)
    scale(1.08)
}

.wheel-percent{
  position:absolute;

  right:40px;
  top:50%;

  transform:translateY(-50%);

  min-width:48px;

  padding:5px 7px;

  border:1px solid #26363c;

  border-radius:8px;

  background:#080d0ff5;

  color:#76e5fd;

  font-size:10px;

  font-weight:900;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transition:.15s
}

.page-wheel:hover .wheel-percent,
.page-wheel.dragging .wheel-percent{
  opacity:1
}


/* =========================================================
   ANIMATIONS / MOBILE
========================================================= */

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

@media(max-width:650px){

  .bar{
    grid-template-columns:auto 1fr auto;

    height:62px;

    padding:7px 9px
  }

  .brand-back{
    padding:7px 8px
  }

  .brand-back span{
    display:none
  }

  .brand-mark{
    width:27px;
    height:27px
  }

  .title span{
    font-size:7px
  }

  .title b{
    font-size:12px;
    max-width:52vw
  }

  .icon-btn{
    width:38px;
    height:38px
  }

  .reader{
    min-height:calc(100vh - 62px);

    padding-bottom:24px
  }

  .chapter-jump{
    bottom:73px
  }

  .settings{
    border-radius:18px;

    padding:15px
  }

  .settings-head h2{
    font-size:18px
  }

  .page-wheel{
    right:5px;

    width:30px;

    height:36vh;

    min-height:190px
  }

  .wheel-btn{
    width:24px;
    height:24px;

    font-size:12px
  }

  .wheel-thumb{
    width:20px;
    height:20px
  }

  .wheel-percent{
    right:35px
  }

  .chapter-end{
    width:
      calc(100% - 18px);

    padding:
      24px 12px
  }
}
</style>
</head>

<body>

<header class="bar">

  <a
    class="brand-back"
    href="index.html#chapters"
  >
    <img
      class="brand-mark"
      src="assets/vortex-mark-white.png"
      alt=""
    >

    <span>الفصول</span>
  </a>


  <div class="title">

    <span>
      BORUTO — TWO BLUE VORTEX
    </span>

    <b id="chapterTitle">
      جاري التحميل...
    </b>

  </div>


  <div class="controls">

    <button
      class="icon-btn"
      id="chapterMenu"
      aria-label="قائمة الفصول"
      title="قائمة الفصول"
    >
      ☷
    </button>

    <button
      class="icon-btn"
      id="settingsBtn"
      aria-label="إعدادات القراءة"
      title="إعدادات القراءة"
    >
      ⚙
    </button>

    <button
      class="icon-btn"
      id="full"
      aria-label="ملء الشاشة"
      title="ملء الشاشة"
    >
      ⛶
    </button>

  </div>


  <div class="progress">
    <i id="progressBar"></i>
  </div>

</header>


<main
  id="reader"
  class="reader"
>
  <div class="status">
    جاري تحميل الصفحات...
  </div>
</main>


<!-- ======================================================
     CHAPTER SELECT
======================================================= -->

<div
  id="chapterJump"
  class="chapter-jump"
  aria-hidden="true"
>

  <select
    id="chapterSelect"
    aria-label="اختيار الفصل"
  ></select>

  <small>
    اختر فصلًا للانتقال إليه مباشرة
  </small>

</div>


<!-- ======================================================
     SETTINGS
======================================================= -->

<div
  id="settingsBackdrop"
  class="settings-backdrop"
></div>


<section
  id="settings"
  class="settings"
  aria-label="إعدادات القراءة"
>

  <div class="settings-head">

    <div>

      <h2>
        إعدادات القراءة
      </h2>

      <p>
        خصص طريقة عرض الفصل كما تريد.
      </p>

    </div>

    <button
      id="closeSettings"
      class="close"
      aria-label="إغلاق"
    >
      ×
    </button>

  </div>


  <div class="setting">

    <label>
      طريقة القراءة
    </label>

    <div class="choices">

      <button
        class="choice active"
        data-mode="vertical"
      >
        عمودي
      </button>

      <button
        class="choice"
        data-mode="single"
      >
        صفحة واحدة
      </button>

    </div>

  </div>


  <div class="setting">

      عرض الصفحة

        100%

    </div>

    <p class="setting-note">

    </p>

  </div>


  <div class="setting">

    <label>
      الخلفية
    </label>

    <div class="choices">

      <button
        class="choice active"
        data-bg="black"
      >
        سوداء
      </button>

      <button
        class="choice"
        data-bg="dark"
      >
        داكنة
      </button>

    </div>

  </div>


  <div class="setting">

    <div class="setting-actions">

      <button
        id="resetSettings"
      >
        إعادة الضبط
      </button>

      <button
        id="doneSettings"
        class="primary"
      >
        تم
      </button>

    </div>

  </div>

</section>


<!-- ======================================================
     PAGE WHEEL
======================================================= -->

<aside
  id="pageWheel"
  class="page-wheel"
  aria-label="التنقل السريع بين صفحات الفصل"
>

  <button
    id="wheelTop"
    class="wheel-btn"
    title="أول صفحة"
    aria-label="أول صفحة"
  >
    ↑
  </button>


  <div
    id="wheelTrack"
    class="wheel-track"
    role="slider"
    tabindex="0"
    aria-label="التنقل بين صفحات الفصل"
    aria-valuemin="1"
    aria-valuemax="1"
    aria-valuenow="1"
  >

    <div
      id="wheelFill"
      class="wheel-fill"
    ></div>

    <div
      id="wheelThumb"
      class="wheel-thumb"
    ></div>

    <span
      id="wheelPercent"
      class="wheel-percent"
    >
      0%
    </span>

  </div>


  <button
    id="wheelBottom"
    class="wheel-btn"
    title="آخر صفحة"
    aria-label="آخر صفحة"
  >
    ↓
  </button>

</aside>


<button
  id="toolbarRecovery"
  class="toolbar-recovery"
>
  إظهار شريط القراءة
</button>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://smgvqaunvvkbwkkgmccx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_S7Wd8d7OGc1m7bsHY4Awnw_ToSxY_j6";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   HELPERS
========================================================= */

const $ =
  id =>
    document.getElementById(id);


function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =========================================================
   URL
========================================================= */

const requested =
  new URLSearchParams(
    location.search
  ).get("chapter");


/* =========================================================
   STATE
========================================================= */

let images = [];

let index = 0;

let mode = "vertical";

let chapters = [];

let currentChapter = null;

let currentChapterIndex = -1;


/* =========================================================
   STORAGE URL
========================================================= */

function publicUrl(path){

  if(!path){
    return "";
  }

  const clean =
    String(path)
      .split("/")
      .filter(Boolean)
      .map(
        encodeURIComponent
      )
      .join("/");

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/manga-pages/" +
    clean
  );

}


/* =========================================================
   SETTINGS
========================================================= */

function saveSettings(){

  localStorage.setItem(
    "vortexReaderSettings",
    JSON.stringify({

      mode,

      width:
        Number(
          $("widthRange").value
        ) || 100,

      bg:
        document.body.dataset.bg ||
        "black"

    })
  );

}


function loadSettings(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "vortexReaderSettings"
        ) || "{}"
      );


    setWidth(
      saved.width ?? 100,
      false
    );


    setBg(
      saved.bg || "black",
      false
    );


    setMode(
      saved.mode || "vertical",
      false
    );


  }catch{

    setMode(
      "vertical",
      false
    );

    setWidth(
      100,
      false
    );

    setBg(
      "black",
      false
    );

  }

}


function setWidth(
  value,
  save = true
){

  value =
    Math.max(
      70,
      Math.min(
        100,
        Number(value) || 100
      )
    );


  $("widthRange").value =
    value;


  $("widthValue").textContent =
    value + "%";


  document.documentElement.style
    .setProperty(
      "--reader-width",
      value + "%"
    );


  if(save){
    saveSettings();
  }

}


function setBg(
  value,
  save = true
){

  document.body.dataset.bg =
    value;


  document.documentElement.style
    .setProperty(
      "--bg",
      value === "dark"
        ? "#090d0f"
        : "#050708"
    );


  document
    .querySelectorAll(
      "[data-bg]"
    )
    .forEach(
      button =>
        button.classList.toggle(
          "active",
          button.dataset.bg === value
        )
    );


  if(save){
    saveSettings();
  }

}


function setMode(
  value,
  save = true
){

  mode =
    value === "single"
      ? "single"
      : "vertical";


  document.body.classList.toggle(
    "single",
    mode === "single"
  );


  document
    .querySelectorAll(
      "[data-mode]"
    )
    .forEach(
      button =>
        button.classList.toggle(
          "active",
          button.dataset.mode === mode
        )
    );


  render(false);


  if(save){
    saveSettings();
  }

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function populateChapterSelect(){

  const select =
    $("chapterSelect");

  select.innerHTML = "";


  chapters.forEach(
    (chapter, i) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        chapter.number;


      option.textContent =
        `الفصل ${chapter.number}${
          chapter.title
            ? " — " + chapter.title
            : ""
        }`;


      if(
        i ===
        currentChapterIndex
      ){

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );

}


function goToChapter(
  number
){

  if(number == null){
    return;
  }


  location.href =
    `reader.html?chapter=${
      encodeURIComponent(number)
    }`;

}


async function loadChapters(){

  const result =
    await db
      .from("chapters")
      .select(
        "id,number,title,published_at"
      )
      .order(
        "number",
        {
          ascending:true
        }
      );


  if(result.error){

    throw new Error(
      "تعذر تحميل قائمة الفصول: " +
      result.error.message
    );

  }


  chapters =
    result.data || [];


  currentChapterIndex =
    chapters.findIndex(
      chapter =>
        Number(chapter.number) ===
        Number(requested)
    );


  populateChapterSelect();

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const reader =
    $("reader");


  loadSettings();


  try{

    if(!requested){

      throw new Error(
        "رقم الفصل غير موجود في الرابط. افتح الفصل من قائمة الفصول."
      );

    }


    const number =
      Number(requested);


    if(
      !Number.isInteger(number) ||
      number < 1
    ){

      throw new Error(
        "رقم الفصل غير صالح: " +
        escapeHtml(requested)
      );

    }


    const [
      chapterQuery
    ] =
      await Promise.all([

        db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "number",
            number
          )
          .maybeSingle(),

        loadChapters()

      ]);


    if(
      chapterQuery.error
    ){

      throw new Error(
        "فشل قراءة الفصل: " +
        chapterQuery.error.message
      );

    }


    if(
      !chapterQuery.data
    ){

      throw new Error(
        "لم يتم العثور على الفصل رقم " +
        number +
        "."
      );

    }


    currentChapter =
      chapterQuery.data;


    currentChapterIndex =
      chapters.findIndex(
        chapter =>
          Number(chapter.number) ===
          Number(number)
      );


    $("chapterTitle")
      .textContent =
        `الفصل ${currentChapter.number}${
          currentChapter.title
            ? " — " +
              currentChapter.title
            : ""
        }`;


    populateChapterSelect();


    const pages =
      await db
        .from("pages")
        .select(
          "id,page_number,storage_path"
        )
        .eq(
          "chapter_id",
          currentChapter.id
        )
        .order(
          "page_number",
          {
            ascending:true
          }
        );


    if(pages.error){

      throw new Error(
        "تم العثور على الفصل، لكن تعذر قراءة جدول الصفحات: " +
        pages.error.message
      );

    }


    if(
      !pages.data?.length
    ){

      throw new Error(
        "الفصل موجود، لكن لا توجد صفحات مسجلة له."
      );

    }


    images =
      pages.data.map(
        page => ({

          page:
            page.page_number,

          path:
            page.storage_path,

          url:
            publicUrl(
              page.storage_path
            )

        })
      );


    render(true);

    updateProgress();


    window.addEventListener(
      "scroll",
      updateProgress,
      {
        passive:true
      }
    );


  }catch(error){

    reader.innerHTML = `

      <div class="status error">

        <h3>
          تعذر تحميل الفصل
        </h3>

        <div>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </div>

      </div>

    `;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(
  resetIndex = true
){

  const reader =
    $("reader");


  if(!images.length){
    return;
  }


  reader.innerHTML = "";


  images.forEach(
    (page, i) => {

      const wrap =
        document.createElement(
          "div"
        );


      wrap.className =
        "page-wrap";


      wrap.dataset.index =
        i;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        page.url;


      img.alt =
        `صفحة ${page.page}`;


      img.loading =
        i < 2
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.referrerPolicy =
        "no-referrer";


      img.onerror =
        () => {

          wrap.innerHTML = `

            <div class="status error">

              تعذر تحميل الصفحة
              ${escapeHtml(page.page)}

              <br>

              <small>
                المسار:
                ${escapeHtml(page.path)}
              </small>

            </div>

          `;

        };


      wrap.appendChild(
        img
      );


      reader.appendChild(
        wrap
      );

    }
  );


  if(
    mode === "single"
  ){

    index =
      resetIndex
        ? 0
        : Math.min(
            index,
            images.length - 1
          );


    setSingle(
      index
    );

  }


  addChapterEnd();

  updateProgress();

  updatePageWheel();

}


/* =========================================================
   SINGLE PAGE
========================================================= */

function setSingle(
  value
){

  index =
    Math.max(
      0,
      Math.min(
        images.length - 1,
        value
      )
    );


  document
    .querySelectorAll(
      ".page-wrap"
    )
    .forEach(
      (element, number) => {

        element.classList.toggle(
          "active",
          number === index
        );

      }
    );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  updateProgress();

  updatePageWheel();

}


/* =========================================================
   END OF CHAPTER
========================================================= */

function addChapterEnd(){

  const end =
    document.createElement(
      "section"
    );


  end.className =
    "chapter-end";


  const previousExists =
    currentChapterIndex > 0;


  const nextExists =
    currentChapterIndex >= 0 &&
    currentChapterIndex <
      chapters.length - 1;


  end.innerHTML = `

    <div class="eyebrow">
      END OF CHAPTER
    </div>

    <h3>
      نهاية الفصل
      ${escapeHtml(
        currentChapter?.number ?? ""
      )}
    </h3>

    <p>
      يمكنك متابعة القراءة مباشرة من هنا.
    </p>

    <div class="chapter-end-actions">

      <button
        id="endPrev"
        ${
          previousExists
            ? ""
            : "disabled"
        }
      >
        ${
          previousExists
            ? "‹ الفصل السابق"
            : "لا يوجد فصل سابق"
        }
      </button>


      <button
        id="endList"
        class="primary"
      >
        قائمة الفصول
      </button>


      <button
        id="endNext"
        class="primary"
        ${
          nextExists
            ? ""
            : "disabled"
        }
      >
        ${
          nextExists
            ? "الفصل التالي ›"
            : "لا يوجد فصل تالي"
        }
      </button>

    </div>

  `;


  $("reader")
    .appendChild(
      end
    );


  $("endPrev").onclick =
    () => {

      if(
        previousExists
      ){

        goToChapter(
          chapters[
            currentChapterIndex - 1
          ].number
        );

      }

    };


  $("endNext").onclick =
    () => {

      if(
        nextExists
      ){

        goToChapter(
          chapters[
            currentChapterIndex + 1
          ].number
        );

      }

    };


  $("endList").onclick =
    openChapterMenu;

}


/* =========================================================
   PAGE WHEEL
========================================================= */

function updatePageWheel(){

  const track =
    $("wheelTrack");

  const thumb =
    $("wheelThumb");

  const fill =
    $("wheelFill");

  const percent =
    $("wheelPercent");


  if(
    !track ||
    !thumb ||
    !fill
  ){

    return;

  }


  let value = 0;


  if(
    mode === "single"
  ){

    value =
      images.length > 1
        ? (
            index /
            (images.length - 1)
          ) * 100
        : 0;


    track.setAttribute(
      "aria-valuemax",
      String(
        Math.max(
          images.length,
          1
        )
      )
    );


    track.setAttribute(
      "aria-valuenow",
      String(
        Math.min(
          index + 1,
          Math.max(
            images.length,
            1
          )
        )
      )
    );

  }else{

    const max =
      document.documentElement
        .scrollHeight -
      window.innerHeight;


    value =
      max > 0
        ? (
            window.scrollY /
            max
          ) * 100
        : 0;


    const page =
      Math.min(
        images.length,
        Math.max(
          1,
          Math.round(
            (
              value / 100
            ) *
            Math.max(
              images.length - 1,
              0
            )
          ) + 1
        )
      );


    track.setAttribute(
      "aria-valuemax",
      String(
        Math.max(
          images.length,
          1
        )
      )
    );


    track.setAttribute(
      "aria-valuenow",
      String(page)
    );

  }


  value =
    Math.max(
      0,
      Math.min(
        100,
        value
      )
    );


  const usable =
    track.clientHeight - 4;


  thumb.style.top =
    (
      usable *
      (value / 100)
      + 2
    ) + "px";


  fill.style.height =
    Math.max(
      0,
      usable *
      (value / 100)
    ) + "px";


  if(percent){

    percent.textContent =
      Math.round(value) +
      "%";

  }

}


function wheelScrollToPercent(
  value
){

  value =
    Math.max(
      0,
      Math.min(
        100,
        Number(value) || 0
      )
    );


  if(
    mode === "single"
  ){

    setSingle(
      Math.round(
        (
          value / 100
        ) *
        Math.max(
          images.length - 1,
          0
        )
      )
    );

  }else{

    const max =
      document.documentElement
        .scrollHeight -
      window.innerHeight;


    window.scrollTo({
      top:
        max *
        (value / 100),

      behavior:
        "smooth"
    });

  }


  updatePageWheel();

}


function wheelPercentFromClientY(
  clientY
){

  const track =
    $("wheelTrack");


  if(!track){
    return 0;
  }


  const rect =
    track.getBoundingClientRect();


  return (
    (
      clientY -
      rect.top
    ) /
    Math.max(
      rect.height,
      1
    )
  ) * 100;

}


function startWheelDrag(
  event
){

  event.preventDefault();


  $("pageWheel")
    .classList.add(
      "dragging"
    );


  const move =
    event => {

      const point =
        event.touches?.[0] ||
        event;


      wheelScrollToPercent(
        wheelPercentFromClientY(
          point.clientY
        )
      );

    };


  const end =
    () => {

      $("pageWheel")
        .classList.remove(
          "dragging"
        );


      window.removeEventListener(
        "pointermove",
        move
      );


      window.removeEventListener(
        "touchmove",
        move
      );

    };


  window.addEventListener(
    "pointermove",
    move,
    {
      passive:false
    }
  );


  window.addEventListener(
    "pointerup",
    end,
    {
      once:true
    }
  );


  window.addEventListener(
    "touchmove",
    move,
    {
      passive:false
    }
  );


  window.addEventListener(
    "touchend",
    end,
    {
      once:true
    }
  );


  const point =
    event.touches?.[0] ||
    event;


  wheelScrollToPercent(
    wheelPercentFromClientY(
      point.clientY
    )
  );

}


function setupPageWheel(){

  const track =
    $("wheelTrack");

  const thumb =
    $("wheelThumb");


  if(
    !track ||
    !thumb
  ){

    return;

  }


  track.addEventListener(
    "pointerdown",
    startWheelDrag
  );


  thumb.addEventListener(
    "pointerdown",
    startWheelDrag
  );


  track.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Home"
      ){

        event.preventDefault();

        wheelScrollToPercent(
          0
        );

      }else if(
        event.key === "End"
      ){

        event.preventDefault();

        wheelScrollToPercent(
          100
        );

      }else if(
        event.key === "ArrowUp" ||
        event.key === "ArrowLeft"
      ){

        event.preventDefault();

        wheelScrollToPercent(
          currentWheelPercent() - 5
        );

      }else if(
        event.key === "ArrowDown" ||
        event.key === "ArrowRight"
      ){

        event.preventDefault();

        wheelScrollToPercent(
          currentWheelPercent() + 5
        );

      }

    }
  );


  $("wheelTop").onclick =
    () =>
      wheelScrollToPercent(
        0
      );


  $("wheelBottom").onclick =
    () =>
      wheelScrollToPercent(
        100
      );

}


function currentWheelPercent(){

  if(
    mode === "single"
  ){

    return images.length > 1
      ? (
          index /
          (images.length - 1)
        ) * 100
      : 0;

  }


  const max =
    document.documentElement
      .scrollHeight -
    window.innerHeight;


  return max > 0
    ? (
        window.scrollY /
        max
      ) * 100
    : 0;

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  if(
    mode === "single"
  ){

    const value =
      (
        (index + 1) /
        Math.max(
          images.length,
          1
        )
      ) * 100;


    $("progressBar")
      .style.width =
        value + "%";


    updatePageWheel();

    return;

  }


  const documentElement =
    document.documentElement;


  const max =
    documentElement.scrollHeight -
    window.innerHeight;


  const value =
    max > 0
      ? (
          window.scrollY /
          max
        ) * 100
      : 0;


  $("progressBar")
    .style.width =
      Math.max(
        0,
        Math.min(
          100,
          value
        )
      ) + "%";


  updatePageWheel();

}


/* =========================================================
   CHAPTER MENU
========================================================= */

function openChapterMenu(){

  const menu =
    $("chapterJump");


  menu.classList.toggle(
    "open"
  );


  menu.setAttribute(
    "aria-hidden",
    String(
      !menu.classList.contains(
        "open"
      )
    )
  );

}


/* =========================================================
   SETTINGS
========================================================= */

function closeSettings(){

  $("settings")
    .classList.remove(
      "open"
    );


  $("settingsBackdrop")
    .classList.remove(
      "open"
    );

}


function openSettings(){

  $("settings")
    .classList.add(
      "open"
    );


  $("settingsBackdrop")
    .classList.add(
      "open"
    );

}


/* =========================================================
   TOOLBAR
========================================================= */

function forceToolbarVisible(){

  document.body.classList.remove(
    "toolbar-hidden"
  );

}


/* =========================================================
   EVENTS
========================================================= */

$("chapterMenu").onclick =
  openChapterMenu;


$("chapterSelect").onchange =
  event =>
    goToChapter(
      event.target.value
    );


$("settingsBtn").onclick =
  openSettings;


$("closeSettings").onclick =
  closeSettings;


$("doneSettings").onclick =
  () => {

    saveSettings();

    closeSettings();

  };


$("settingsBackdrop").onclick =
  closeSettings;


$("widthRange").oninput =
  event =>
    setWidth(
      event.target.value
    );


$("resetSettings").onclick =
  () => {

    setMode(
      "vertical",
      false
    );

    setWidth(
      100,
      false
    );

    setBg(
      "black",
      false
    );

    saveSettings();

  };


document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button =>
      button.onclick =
        () =>
          setMode(
            button.dataset.mode
          )
  );


document
  .querySelectorAll(
    "[data-bg]"
  )
  .forEach(
    button =>
      button.onclick =
        () =>
          setBg(
            button.dataset.bg
          )
  );


$("full").onclick =
  () => {

    if(
      document.fullscreenElement
    ){

      document.exitFullscreen?.();

    }else{

      document
        .documentElement
        .requestFullscreen?.();

    }

  };


/*
 * لا يوجد هنا أي زر أو وظيفة
 * للتنقل بين الفصول أثناء القراءة.
 *
 * الأسهم تعمل فقط مع عجلة الصفحات
 * من خلال واجهة التنقل الجانبية.
 */

window.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeSettings();

      $("chapterJump")
        .classList.remove(
          "open"
        );

    }

  }
);


document.addEventListener(
  "click",
  event => {

    const menu =
      $("chapterJump");


    if(
      menu.classList.contains(
        "open"
      ) &&
      !menu.contains(
        event.target
      ) &&
      event.target !==
        $("chapterMenu")
    ){

      menu.classList.remove(
        "open"
      );

    }

  }
);


$("toolbarRecovery").onclick =
  forceToolbarVisible;


document.addEventListener(
  "fullscreenchange",
  () => {

    forceToolbarVisible();

  }
);


window.addEventListener(
  "resize",
  updatePageWheel,
  {
    passive:true
  }
);


/* =========================================================
   START
========================================================= */

setupPageWheel();

forceToolbarVisible();

init();

</script>
