<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

        content="VORTEX — معلومات المانجا والفصول"
    >

    <title>VORTEX — المانجا</title>

    <!-- Core -->
    <link
        rel="stylesheet"
        href="css/core.css"

</head>


<body data-page="manga">

    ========================================== -->

                    </p>

    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="app-footer"></div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>
