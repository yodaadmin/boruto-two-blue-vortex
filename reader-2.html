<!doctype html>

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">
<title>قارئ الفصل — دوامتان زرقاوتان</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}

body.light{
  background:#eee;
  color:#111
}

.bar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 14px;
  background:#07111bee;
  border-bottom:1px solid #233746;
  backdrop-filter:blur(12px)
}

.bar a,
.bar button{
  color:#fff;
  text-decoration:none;
  background:#142532;
  border:0;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer
}

.title{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:0
}

.title span{
  font-size:12px;
  color:#9bb0bd
}

.title b{
  font-size:15px
}

.controls{
  display:flex;
  gap:6px
}

.reader{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  min-height:calc(100vh - 60px);
  padding-bottom:90px
}

.page-wrap{
  width:100%;
  text-align:center;
  line-height:0
}

.reader img{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto;
  user-select:none;
  -webkit-user-drag:none
}

body.fit-original .reader img{
  max-width:none
}

body.single .reader img{
  display:none
}

body.single .reader img.active{
  display:block;
  max-height:calc(100vh - 70px);
  width:auto;
  object-fit:contain
}

.status{
  padding:40px 18px;
  text-align:center;
  color:#9fb2bf;
  max-width:900px
}

.status.error{
  color:#ff9da8
}

.status h3{
  margin:0 0 12px
}

.status small{
  color:#8296a4;
  word-break:break-all
}

.bottom{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  background:#0c1a25ef;
  border:1px solid #28404f;
  border-radius:16px;
  padding:8px;
  display:flex;
  gap:8px;
  align-items:center;
  backdrop-filter:blur(10px)
}

.bottom button{
  background:#18303f;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:9px 13px;
  cursor:pointer
}

.bottom span{
  font-size:12px;
  color:#b9cbd5;
  min-width:90px;
  text-align:center
}
</style></head><body><header class="bar">  <a href="index.html#chapters">
    ‹ الفصول
  </a>  <div class="title">
    <span>بوروتو: دوامتان زرقاوتان</span>
    <b id="chapterTitle">جاري التحميل...</b>
  </div>  <div class="controls">
    <button id="mode">↔</button>
    <button id="full">⛶</button>
  </div></header><main id="reader" class="reader">
  <div class="status">
    جاري تحميل الصفحات...
  </div>
</main><div class="bottom">
  <button id="prev">السابق</button>
  <span id="counter">—</span>
  <button id="next">التالي</button>
</div><script>

const SUPABASE_URL =
  'https://smgvqaunvvkbwkkgmccx.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_S7Wd8d7OGc1m7bsHY4Awnw_ToSxY_j6';

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   URL
========================= */

const requested =
  new URLSearchParams(location.search)
    .get("chapter");

let images = [];
let index = 0;
let mode = "vertical";


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =========================
   STORAGE URL
========================= */

function publicUrl(path){

  if(!path){
    return "";
  }

  const clean =
    String(path)
      .split("/")
      .filter(Boolean)
      .map(encodeURIComponent)
      .join("/");

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/manga-pages/" +
    clean
  );

}


/* =========================
   UUID CHECK
========================= */

function isUUID(value){

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(
      String(value || "").trim()
    );

}


/* =========================
   SAFE NUMBER
========================= */

function safePageNumber(value,index){

  const n = Number(value);

  if(
    Number.isFinite(n) &&
    n > 0
  ){

    return n;

  }

  return index + 1;

}


/* =========================
   INIT
========================= */

async function init(){

  const reader =
    document.getElementById("reader");

  try{

    if(!requested){

      throw new Error(
        "معرّف الفصل غير موجود في الرابط."
      );

    }


    const chapterId =
      String(requested).trim();


    /*
     * إذا كان الرابط UUID:
     * نبحث في id.
     *
     * إذا كان رقمًا:
     * نبحث في number.
     */

    let chapterResult;


    if(isUUID(chapterId)){

      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "id",
            chapterId
          )
          .maybeSingle();

    }else{

      const number =
        Number(chapterId);


      if(
        !Number.isInteger(number) ||
        number < 1
      ){

        throw new Error(
          "معرّف الفصل غير صالح."
        );

      }


      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "number",
            number
          )
          .maybeSingle();

    }


    if(chapterResult.error){

      throw new Error(
        "فشل قراءة الفصل: " +
        chapterResult.error.message
      );

    }


    if(!chapterResult.data){

      throw new Error(
        "لم يتم العثور على الفصل المطلوب."
      );

    }


    const chapter =
      chapterResult.data;


    /* =========================
       CHAPTER TITLE
    ========================= */

    const numberText =
      safePageNumber(
        chapter.number,
        0
      );


    document
      .getElementById("chapterTitle")
      .textContent =
        `الفصل ${numberText} — ${chapter.title || ""}`;


    /* =========================
       LOAD PAGES
    ========================= */

    const pagesResult =
      await db
        .from("pages")
        .select(
          "id,page_number,storage_path"
        )
        .eq(
          "chapter_id",
          chapter.id
        )
        .order(
          "page_number",
          {
            ascending:true
          }
        );


    if(pagesResult.error){

      throw new Error(
        "تم العثور على الفصل، لكن تعذر قراءة الصفحات: " +
        pagesResult.error.message
      );

    }


    const pageRows =
      Array.isArray(pagesResult.data)
        ? pagesResult.data
        : [];


    if(!pageRows.length){

      throw new Error(
        "الفصل موجود، لكن لا توجد صفحات مسجلة له."
      );

    }


    /* =========================
       BUILD IMAGES
    ========================= */

    images =
      pageRows
        .filter(
          p =>
            p &&
            p.storage_path
        )
        .map(
          (p,i) => ({

            page:
              safePageNumber(
                p.page_number,
                i
              ),

            path:
              String(
                p.storage_path
              ),

            url:
              publicUrl(
                p.storage_path
              )

          })
        );


    if(!images.length){

      throw new Error(
        "تم العثور على الصفحات، لكن مسارات الصور فارغة."
      );

    }


    /*
     * =================================================
     * التعديل المهم:
     *
     * نعيد ترتيب الصفحات رقميًا داخل المتصفح.
     *
     * حتى لو أعادت قاعدة البيانات الصفوف بهذا الشكل:
     *
     * 1
     * 3
     * 5
     * 4
     * 2
     *
     * سيصبح الترتيب النهائي:
     *
     * 1
     * 2
     * 3
     * 4
     * 5
     * =================================================
     */

    images.sort(
      (a,b) =>
        a.page - b.page
    );


    /*
     * عرض الصفحات
     */

    render();


  }catch(error){

    console.error(
      "Reader error:",
      error
    );


    reader.innerHTML = `

      <div class="status error">

        <h3>
          تعذر تحميل الفصل
        </h3>

        <div>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </div>

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const reader =
    document.getElementById("reader");

  reader.innerHTML = "";


  images.forEach(
    (page,i) => {

      const wrap =
        document.createElement("div");


      wrap.className =
        "page-wrap";


      const img =
        document.createElement("img");


      img.className =
        "manga-page";


      img.src =
        page.url;


      img.alt =
        `صفحة ${page.page}`;


      img.loading =
        i < 2
          ? "eager"
          : "lazy";


      img.referrerPolicy =
        "no-referrer";


      img.onerror =
        () => {

          wrap.innerHTML = `

            <div class="status error">

              تعذر تحميل الصفحة
              ${escapeHtml(page.page)}

              <br>

              <small>
                المسار:
                ${escapeHtml(page.path)}
              </small>

            </div>

          `;

        };


      wrap.appendChild(img);

      reader.appendChild(wrap);

    }
  );


  document
    .getElementById("counter")
    .textContent =
      `${images.length} صفحة`;


  if(mode === "single"){

    setSingle(0);

  }

}


/* =========================
   SINGLE PAGE
========================= */

function setSingle(i){

  if(!images.length){

    return;

  }


  index =
    Math.max(
      0,
      Math.min(
        images.length - 1,
        i
      )
    );


  [
    ...document.querySelectorAll(
      ".reader img"
    )
  ].forEach(
    (img,n) => {

      img.classList.toggle(
        "active",
        n === index
      );

    }
  );


  document
    .getElementById("counter")
    .textContent =
      `${index + 1} / ${images.length}`;

}


/* =========================
   NEXT
========================= */

document
  .getElementById("next")
  .onclick = () => {

    if(mode === "single"){

      setSingle(
        index + 1
      );

    }else{

      window.scrollBy({

        top:
          window.innerHeight * 0.85,

        behavior:
          "smooth"

      });

    }

  };


/* =========================
   PREVIOUS
========================= */

document
  .getElementById("prev")
  .onclick = () => {

    if(mode === "single"){

      setSingle(
        index - 1
      );

    }else{

      window.scrollBy({

        top:
          -window.innerHeight * 0.85,

        behavior:
          "smooth"

      });

    }

  };


/* =========================
   READING MODE
========================= */

document
  .getElementById("mode")
  .onclick = () => {

    mode =
      mode === "vertical"
        ? "single"
        : "vertical";


    document.body.classList.toggle(
      "single",
      mode === "single"
    );


    render();

  };


/* =========================
   FULLSCREEN
========================= */

document
  .getElementById("full")
  .onclick = () => {

    document.documentElement
      .requestFullscreen?.();

  };


/* =========================
   START
========================= */

init();

</script></body>
</html>
