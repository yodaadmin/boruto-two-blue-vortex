<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">
<title>قارئ الفصل — دوامتان زرقاوتان</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  overflow-x:hidden;
}

a,
button{
  font:inherit;
}

/* =========================================================
   TOP BAR
========================================================= */

.bar{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:8px 14px;

  background:rgba(7,17,27,.92);
  border-bottom:1px solid #233746;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.bar a,
.bar button{
  color:#fff;
  text-decoration:none;

  background:#142532;
  border:1px solid rgba(255,255,255,.04);

  border-radius:10px;
  padding:8px 12px;

  cursor:pointer;

  transition:.2s ease;
}

.bar a:hover,
.bar button:hover{
  background:#1a3444;
}

.title{
  min-width:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:1px;

  text-align:center;
}

.title span{
  font-size:11px;
  color:#8fa4b1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:42vw;
}

.title b{
  font-size:14px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  max-width:42vw;
}

.controls{
  display:flex;
  gap:6px;
}

/* =========================================================
   READER
========================================================= */

.reader{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  min-height:calc(100vh - 60px);

  padding:0 0 90px;
}

.page-wrap{
  width:100%;

  margin:0;
  padding:0;

  text-align:center;
  line-height:0;

  background:#05080c;
}

.reader img{
  display:block;

  width:auto;
  max-width:100%;
  height:auto;

  margin:0 auto;
  padding:0;

  user-select:none;
  -webkit-user-drag:none;

  line-height:0;
}

body.fit-original .reader img{
  max-width:none;
}

/* =========================================================
   SINGLE PAGE MODE
========================================================= */

body.single .reader img{
  display:none;
}

body.single .reader img.active{
  display:block;

  width:auto;
  max-width:100%;
  max-height:calc(100vh - 70px);

  object-fit:contain;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  padding:40px 18px;

  text-align:center;

  color:#9fb2bf;

  max-width:900px;
}

.status.error{
  color:#ff9da8;
}

.status h3{
  margin:0 0 12px;
}

.status small{
  color:#8296a4;

  word-break:break-all;
}

/* =========================================================
   READING SETTINGS
========================================================= */

.settings-panel{
  position:fixed;

  top:68px;
  right:14px;

  z-index:120;

  width:min(330px,calc(100vw - 28px));

  padding:16px;

  border:1px solid #294352;
  border-radius:18px;

  background:rgba(8,18,27,.96);

  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    0 0 30px rgba(19,171,210,.05);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  opacity:0;
  visibility:hidden;

  transform:translateY(-8px) scale(.98);

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;
}

.settings-panel.open{
  opacity:1;
  visibility:visible;

  transform:translateY(0) scale(1);
}

.settings-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:14px;
}

.settings-title strong{
  font-size:14px;
}

.settings-title button{
  width:30px;
  height:30px;

  border:0;
  border-radius:9px;

  color:#fff;
  background:#142532;

  cursor:pointer;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:11px 0;

  border-top:1px solid rgba(255,255,255,.06);
}

.setting-row:first-of-type{
  border-top:0;
}

.setting-row span{
  font-size:12px;
  color:#aebec7;
}

.setting-actions{
  display:flex;
  gap:5px;
}

.setting-actions button{
  border:1px solid #263c49;

  background:#101f29;
  color:#dce8ed;

  border-radius:9px;

  padding:7px 10px;

  font-size:11px;

  cursor:pointer;
}

.setting-actions button.active{
  background:#13abd2;
  color:#031015;
  border-color:#13abd2;
}

/* =========================================================
   SIDE SCRUBBER
========================================================= */

/*
  العجلة ليست جزءًا من تخطيط الصفحة.
  هي Overlay فوق الصفحة بالكامل.
*/

.page-scrubber{
  position:fixed;

  top:60px;
  right:0;
  bottom:0;

  z-index:90;

  width:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

/*
  المنطقة الحساسة على الحافة.
  تجعل الوصول للعجلة سهلًا دون أن تظهر بشكل مزعج.
*/

.scrubber-hitbox{
  position:absolute;

  top:0;
  right:0;
  bottom:0;

  width:38px;

  pointer-events:auto;
}

/*
  العجلة نفسها.
*/

.scrubber{
  position:absolute;

  right:5px;

  width:8px;
  height:62vh;

  min-height:190px;
  max-height:680px;

  border-radius:999px;

  background:rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.035);

  opacity:.16;

  transition:
    opacity .2s ease,
    width .2s ease,
    background .2s ease;

  pointer-events:auto;

  cursor:pointer;

  box-shadow:
    0 0 15px rgba(0,0,0,.25);
}

.scrubber-hitbox:hover .scrubber,
.scrubber:hover,
.scrubber.active{
  opacity:.72;
  width:10px;

  background:rgba(19,171,210,.42);
}

/*
  المقبض.
*/

.scrubber-thumb{
  position:absolute;

  left:50%;

  width:8px;
  height:44px;

  transform:translateX(-50%);

  border-radius:999px;

  background:#76e5fd;

  box-shadow:
    0 0 12px rgba(118,229,253,.4);

  transition:top .08s linear;

  pointer-events:none;
}

/*
  أزرار البداية والنهاية.
*/

.scrubber-top,
.scrubber-bottom{
  position:absolute;

  right:-1px;

  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:rgba(9,20,29,.88);
  border:1px solid rgba(118,229,253,.18);

  color:#76e5fd;

  font-size:13px;

  opacity:0;

  transform:translateX(5px);

  transition:.2s ease;

  cursor:pointer;

  pointer-events:auto;
}

.scrubber-top{
  top:-40px;
}

.scrubber-bottom{
  bottom:-40px;
}

.scrubber-hitbox:hover .scrubber-top,
.scrubber-hitbox:hover .scrubber-bottom,
.scrubber.active ~ .scrubber-top,
.scrubber.active ~ .scrubber-bottom{
  opacity:1;
  transform:translateX(0);
}

/*
  رقم الصفحة يظهر بجانب العجلة
  فقط أثناء التفاعل.
*/

.scrubber-counter{
  position:absolute;

  right:18px;

  top:50%;

  transform:translateY(-50%);

  padding:6px 9px;

  border-radius:8px;

  background:rgba(5,10,15,.9);
  border:1px solid rgba(118,229,253,.15);

  color:#dff8ff;

  font-size:10px;

  white-space:nowrap;

  opacity:0;
  pointer-events:none;

  transition:.2s ease;
}

.scrubber-hitbox:hover .scrubber-counter,
.scrubber.active ~ .scrubber-counter{
  opacity:1;
}

/* =========================================================
   END OF CHAPTER
========================================================= */

.chapter-end{
  width:min(700px,calc(100% - 28px));

  margin:70px auto 20px;

  padding:35px 22px;

  text-align:center;

  border:1px solid #243943;
  border-radius:22px;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(19,171,210,.12),
      transparent 65%
    ),
    #09131b;

  box-shadow:
    0 25px 80px rgba(0,0,0,.35);
}

.chapter-end h2{
  margin:0 0 8px;

  font-size:22px;
}

.chapter-end p{
  margin:0 0 22px;

  color:#91a5af;

  font-size:13px;
}

.chapter-end-actions{
  display:flex;
  justify-content:center;

  gap:8px;
  flex-wrap:wrap;
}

.chapter-end-actions button{
  border:1px solid #29414e;

  background:#122632;

  color:#fff;

  border-radius:11px;

  padding:10px 15px;

  cursor:pointer;

  transition:.2s ease;
}

.chapter-end-actions button:hover{
  background:#13abd2;
  color:#031015;
  border-color:#13abd2;
}

/* =========================================================
   BOTTOM CONTROL
========================================================= */

.bottom{
  position:fixed;

  bottom:14px;
  left:50%;

  transform:translateX(-50%);

  z-index:110;

  background:rgba(12,26,37,.92);

  border:1px solid #28404f;

  border-radius:16px;

  padding:7px;

  display:flex;
  gap:7px;
  align-items:center;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.bottom button{
  background:#18303f;

  color:#fff;

  border:0;

  border-radius:10px;

  padding:8px 12px;

  cursor:pointer;
}

.bottom span{
  font-size:11px;

  color:#b9cbd5;

  min-width:90px;

  text-align:center;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .bar{
    height:56px;
    padding:7px 9px;
  }

  .bar a,
  .bar button{
    padding:7px 9px;
  }

  .title span{
    max-width:30vw;
    font-size:9px;
  }

  .title b{
    max-width:30vw;
    font-size:12px;
  }

  .page-scrubber{
    top:56px;
    width:38px;
  }

  .scrubber{
    right:3px;
    width:7px;
    height:55vh;
  }

  .scrubber-thumb{
    width:7px;
    height:38px;
  }

  .scrubber-counter{
    right:15px;
  }

  .bottom{
    bottom:9px;
    padding:6px;
  }

  .bottom button{
    padding:7px 10px;
  }

}

/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen .bar{
  display:none;
}

:fullscreen .reader{
  min-height:100vh;
}

:fullscreen .page-scrubber{
  top:0;
}

:fullscreen .settings-panel{
  top:14px;
}

</style>
</head>

<body>

<header class="bar">

  <a href="index.html#chapters">
    ‹ الفصول
  </a>

  <div class="title">
    <span>بوروتو: دوامتان زرقاوتان</span>
    <b id="chapterTitle">جاري التحميل...</b>
  </div>

  <div class="controls">
    <button id="settingsBtn" aria-label="إعدادات القراءة">⚙</button>
    <button id="full" aria-label="ملء الشاشة">⛶</button>
  </div>

</header>


<main id="reader" class="reader">

  <div class="status">
    جاري تحميل الصفحات...
  </div>

</main>


<!-- =======================================================
     SIDE SCRUBBER
======================================================= -->

<div class="page-scrubber">

  <div id="scrubberHitbox" class="scrubber-hitbox">

    <div id="scrubber" class="scrubber">

      <div id="scrubberThumb" class="scrubber-thumb"></div>

    </div>

    <button
      id="scrubberTop"
      class="scrubber-top"
      aria-label="العودة إلى أول صفحة"
    >
      ↑
    </button>

    <button
      id="scrubberBottom"
      class="scrubber-bottom"
      aria-label="الانتقال إلى آخر صفحة"
    >
      ↓
    </button>

    <div
      id="scrubberCounter"
      class="scrubber-counter"
    >
      1 / 1
    </div>

  </div>

</div>


<!-- =======================================================
     READING SETTINGS
======================================================= -->

<div
  id="settingsPanel"
  class="settings-panel"
>

  <div class="settings-title">

    <strong>
      إعدادات القراءة
    </strong>

    <button id="closeSettings">
      ×
    </button>

  </div>


  <div class="setting-row">

    <span>
      طريقة العرض
    </span>

    <div class="setting-actions">

      <button
        id="verticalBtn"
        class="active"
      >
        عمودي
      </button>

      <button
        id="singleBtn"
      >
        صفحة
      </button>

    </div>

  </div>


  <div class="setting-row">

    <span>
      عرض الصفحة
    </span>

    <div class="setting-actions">

      <button id="fitBtn">
        مناسب
      </button>

      <button id="originalBtn">
        أصلي
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     BOTTOM CONTROLS
======================================================= -->

<div class="bottom">

  <button id="prev">
    السابق
  </button>

  <span id="counter">
    —
  </span>

  <button id="next">
    التالي
  </button>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://smgvqaunvvkbwkkgmccx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_S7Wd8d7OGc1m7bsHY4Awnw_ToSxY_j6";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   URL
========================================================= */

const requested =
  new URLSearchParams(
    location.search
  ).get("chapter");


/* =========================================================
   STATE
========================================================= */

let images = [];

let index = 0;

let mode = "vertical";

let scrubberDragging = false;

let scrubberTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function isUUID(value){

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(
      String(value || "").trim()
    );

}


function safeNumber(value,index){

  const n =
    Number(value);

  if(
    Number.isFinite(n) &&
    n > 0
  ){

    return n;

  }

  return index + 1;

}


function publicUrl(path){

  if(!path){
    return "";
  }

  const clean =
    String(path)
      .split("/")
      .filter(Boolean)
      .map(
        encodeURIComponent
      )
      .join("/");

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/manga-pages/" +
    clean
  );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const reader =
    document.getElementById(
      "reader"
    );

  try{

    if(!requested){

      throw new Error(
        "معرّف الفصل غير موجود في الرابط."
      );

    }


    const chapterId =
      String(
        requested
      ).trim();


    let chapterResult;


    if(isUUID(chapterId)){

      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "id",
            chapterId
          )
          .maybeSingle();

    }else{

      const number =
        Number(
          chapterId
        );


      if(
        !Number.isInteger(number) ||
        number < 1
      ){

        throw new Error(
          "معرّف الفصل غير صالح."
        );

      }


      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "number",
            number
          )
          .maybeSingle();

    }


    if(chapterResult.error){

      throw new Error(
        "فشل قراءة الفصل: " +
        chapterResult.error.message
      );

    }


    if(!chapterResult.data){

      throw new Error(
        "لم يتم العثور على الفصل المطلوب."
      );

    }


    const chapter =
      chapterResult.data;


    const numberText =
      safeNumber(
        chapter.number,
        0
      );


    document
      .getElementById(
        "chapterTitle"
      )
      .textContent =
        `الفصل ${numberText} — ${chapter.title || ""}`;


    /* =====================================================
       LOAD PAGES
    ===================================================== */

    const pagesResult =
      await db
        .from("pages")
        .select(
          "id,page_number,storage_path"
        )
        .eq(
          "chapter_id",
          chapter.id
        )
        .order(
          "page_number",
          {
            ascending:true
          }
        );


    if(pagesResult.error){

      throw new Error(
        "تم العثور على الفصل، لكن تعذر قراءة الصفحات: " +
        pagesResult.error.message
      );

    }


    const pageRows =
      Array.isArray(
        pagesResult.data
      )
        ? pagesResult.data
        : [];


    if(!pageRows.length){

      throw new Error(
        "الفصل موجود، لكن لا توجد صفحات مسجلة له."
      );

    }


    images =
      pageRows
        .filter(
          p =>
            p &&
            p.storage_path
        )
        .map(
          (p,i) => ({

            page:
              safeNumber(
                p.page_number,
                i
              ),

            path:
              String(
                p.storage_path
              ),

            url:
              publicUrl(
                p.storage_path
              )

          })
        );


    if(!images.length){

      throw new Error(
        "تم العثور على الصفحات، لكن مسارات الصور فارغة."
      );

    }


    images.sort(
      (a,b) =>
        a.page - b.page
    );


    render();

    updateScrubber();

  }catch(error){

    console.error(
      "Reader error:",
      error
    );


    reader.innerHTML = `

      <div class="status error">

        <h3>
          تعذر تحميل الفصل
        </h3>

        <div>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </div>

      </div>

    `;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const reader =
    document.getElementById(
      "reader"
    );

  reader.innerHTML = "";


  images.forEach(
    (page,i) => {

      const wrap =
        document.createElement(
          "div"
        );


      wrap.className =
        "page-wrap";


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "manga-page";


      img.src =
        page.url;


      img.alt =
        `صفحة ${page.page}`;


      img.loading =
        i < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.referrerPolicy =
        "no-referrer";


      img.dataset.pageIndex =
        String(i);


      img.onerror =
        () => {

          wrap.innerHTML = `

            <div class="status error">

              تعذر تحميل الصفحة
              ${escapeHtml(
                page.page
              )}

              <br>

              <small>
                المسار:
                ${escapeHtml(
                  page.path
                )}
              </small>

            </div>

          `;

        };


      wrap.appendChild(
        img
      );

      reader.appendChild(
        wrap
      );

    }
  );


  /*
   * نهاية الفصل
   */

  const end =
    document.createElement(
      "section"
    );

  end.className =
    "chapter-end";

  end.innerHTML = `

    <h2>
      انتهى الفصل
    </h2>

    <p>
      وصلت إلى نهاية الفصل الحالي.
    </p>

    <div class="chapter-end-actions">

      <button
        id="endTop"
      >
        العودة إلى البداية
      </button>

      <button
        id="endChapters"
      >
        قائمة الفصول
      </button>

    </div>

  `;

  reader.appendChild(
    end
  );


  document
    .getElementById(
      "endTop"
    )
    .onclick = () => {

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };


  document
    .getElementById(
      "endChapters"
    )
    .onclick = () => {

      location.href =
        "index.html#chapters";

    };


  document
    .getElementById(
      "counter"
    )
    .textContent =
      `${images.length} صفحة`;


  if(mode === "single"){

    setSingle(
      0
    );

  }

}


/* =========================================================
   SINGLE PAGE
========================================================= */

function setSingle(i){

  if(!images.length){
    return;
  }


  index =
    Math.max(
      0,
      Math.min(
        images.length - 1,
        i
      )
    );


  document
    .querySelectorAll(
      ".reader img"
    )
    .forEach(
      (img,n) => {

        img.classList.toggle(
          "active",
          n === index
        );

      }
    );


  document
    .getElementById(
      "counter"
    )
    .textContent =
      `${index + 1} / ${images.length}`;


  updateScrubber();

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

document
  .getElementById(
    "next"
  )
  .onclick = () => {

    if(mode === "single"){

      if(
        index <
        images.length - 1
      ){

        setSingle(
          index + 1
        );

      }else{

        scrollToEnd();

      }

    }else{

      window.scrollBy({
        top:
          window.innerHeight * .85,
        behavior:
          "smooth"
      });

    }

  };


document
  .getElementById(
    "prev"
  )
  .onclick = () => {

    if(mode === "single"){

      if(index > 0){

        setSingle(
          index - 1
        );

      }else{

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }

    }else{

      window.scrollBy({
        top:
          -window.innerHeight * .85,
        behavior:
          "smooth"
      });

    }

  };


function scrollToEnd(){

  window.scrollTo({
    top:
      document.documentElement.scrollHeight,
    behavior:
      "smooth"
  });

}


/* =========================================================
   SETTINGS
========================================================= */

const settingsPanel =
  document.getElementById(
    "settingsPanel"
  );

document
  .getElementById(
    "settingsBtn"
  )
  .onclick = () => {

    settingsPanel.classList.toggle(
      "open"
    );

  };


document
  .getElementById(
    "closeSettings"
  )
  .onclick = () => {

    settingsPanel.classList.remove(
      "open"
    );

  };


document
  .getElementById(
    "verticalBtn"
  )
  .onclick = () => {

    mode =
      "vertical";

    document.body.classList.remove(
      "single"
    );

    document
      .getElementById(
        "verticalBtn"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "singleBtn"
      )
      .classList.remove(
        "active"
      );

    render();

  };


document
  .getElementById(
    "singleBtn"
  )
  .onclick = () => {

    mode =
      "single";

    document.body.classList.add(
      "single"
    );

    document
      .getElementById(
        "singleBtn"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "verticalBtn"
      )
      .classList.remove(
        "active"
      );

    render();

  };


/* =========================================================
   FIT / ORIGINAL
========================================================= */

document
  .getElementById(
    "fitBtn"
  )
  .onclick = () => {

    document.body.classList.remove(
      "fit-original"
    );

  };


document
  .getElementById(
    "originalBtn"
  )
  .onclick = () => {

    document.body.classList.add(
      "fit-original"
    );

  };


/* =========================================================
   FULLSCREEN
========================================================= */

document
  .getElementById(
    "full"
  )
  .onclick = async () => {

    try{

      if(
        !document.fullscreenElement
      ){

        await document.documentElement
          .requestFullscreen();

      }else{

        await document.exitFullscreen();

      }

    }catch(error){

      console.error(
        "Fullscreen error:",
        error
      );

    }

  };


/* =========================================================
   SIDE SCRUBBER
========================================================= */

const scrubber =
  document.getElementById(
    "scrubber"
  );

const scrubberHitbox =
  document.getElementById(
    "scrubberHitbox"
  );

const scrubberThumb =
  document.getElementById(
    "scrubberThumb"
  );

const scrubberCounter =
  document.getElementById(
    "scrubberCounter"
  );


function updateScrubber(){

  if(!images.length){
    return;
  }


  let currentIndex =
    index;


  if(mode === "vertical"){

    const maxScroll =
      document.documentElement
        .scrollHeight -
      window.innerHeight;


    if(maxScroll > 0){

      const ratio =
        window.scrollY /
        maxScroll;

      currentIndex =
        Math.round(
          ratio *
          (images.length - 1)
        );

    }else{

      currentIndex = 0;

    }

  }


  const ratio =
    images.length <= 1
      ? 0
      : currentIndex /
        (images.length - 1);


  const trackHeight =
    scrubber.clientHeight;


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const maxTop =
    Math.max(
      0,
      trackHeight -
      thumbHeight
    );


  scrubberThumb.style.top =
    `${ratio * maxTop}px`;


  scrubberCounter.textContent =
    `${currentIndex + 1} / ${images.length}`;

}


function activateScrubber(){

  scrubber.classList.add(
    "active"
  );

  clearTimeout(
    scrubberTimer
  );

  scrubberTimer =
    setTimeout(
      () => {

        if(!scrubberDragging){

          scrubber.classList.remove(
            "active"
          );

        }

      },
      1800
    );

}


function seekFromPointer(clientY){

  const rect =
    scrubber.getBoundingClientRect();


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const usable =
    Math.max(
      1,
      rect.height -
      thumbHeight
    );


  let y =
    clientY -
    rect.top -
    thumbHeight / 2;


  y =
    Math.max(
      0,
      Math.min(
        usable,
        y
      )
    );


  const ratio =
    y /
    usable;


  const target =
    Math.round(
      ratio *
      (images.length - 1)
    );


  if(mode === "single"){

    setSingle(
      target
    );

  }else{

    const targetPage =
      document.querySelectorAll(
        ".page-wrap"
      )[target];


    if(targetPage){

      targetPage.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  }


  updateScrubber();

}


/*
 * Click
 */

scrubberHitbox.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target ===
        document.getElementById(
          "scrubberTop"
        ) ||
      event.target ===
        document.getElementById(
          "scrubberBottom"
        )
    ){

      return;

    }


    scrubberDragging =
      true;

    scrubber.setPointerCapture?.(
      event.pointerId
    );

    activateScrubber();

    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointermove",
  event => {

    if(!scrubberDragging){
      return;
    }

    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointerup",
  () => {

    scrubberDragging =
      false;

    activateScrubber();

  }
);


scrubberHitbox.addEventListener(
  "pointercancel",
  () => {

    scrubberDragging =
      false;

  }
);


/* =========================================================
   TOP / BOTTOM
========================================================= */

document
  .getElementById(
    "scrubberTop"
  )
  .onclick = event => {

    event.stopPropagation();

    if(mode === "single"){

      setSingle(
        0
      );

    }else{

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

    activateScrubber();

  };


document
  .getElementById(
    "scrubberBottom"
  )
  .onclick = event => {

    event.stopPropagation();

    if(mode === "single"){

      setSingle(
        images.length - 1
      );

    }else{

      window.scrollTo({
        top:
          document.documentElement
            .scrollHeight,
        behavior:"smooth"
      });

    }

    activateScrubber();

  };


/* =========================================================
   SCROLL TRACKING
========================================================= */

let scrollTimer = null;

window.addEventListener(
  "scroll",
  () => {

    if(mode === "vertical"){

      updateScrubber();

    }

    clearTimeout(
      scrollTimer
    );

    scrollTimer =
      setTimeout(
        () => {

          scrubber.classList.remove(
            "active"
          );

        },
        1200
      );

  },
  {
    passive:true
  }
);


window.addEventListener(
  "resize",
  updateScrubber
);


/* =========================================================
   EDGE ACTIVATION
========================================================= */

document.addEventListener(
  "pointermove",
  event => {

    if(
      event.clientX >
      window.innerWidth - 55
    ){

      activateScrubber();

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   START
========================================================= */

init();

</script>

        </html>
