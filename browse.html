<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VORTEX GROUP — تصفح الأعمال حسب الأقسام والتصنيفات">
    <title>VORTEX GROUP — تصفح الأعمال</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/browse.css">
</head>
<body data-page="browse">

    <div id="app-header"></div>

    <main>
        <div class="container">

            <div class="page-title">
                <span class="eyebrow">المكتبة</span>
                <h1>تصفح الأعمال</h1>
                <p>كل الأعمال مقسّمة حسب التصنيفات. اختر قسماً أو ابحث أو صفِّ حسب النوع والحالة.</p>
            </div>

            <div class="bbar">
                <div id="type-tabs" class="pills"></div>
                <div class="bbar-row">
                    <input id="q" type="search" placeholder="ابحث في المكتبة...">
                    <select id="f-status" aria-label="الحالة"></select>
                    <select id="f-sort" aria-label="الترتيب"></select>
                    <div class="seg" role="group" aria-label="طريقة العرض">
                        <button type="button" data-mode="sections">الأقسام</button>
                        <button type="button" data-mode="all">كل الأعمال</button>
                    </div>
                </div>
            </div>

            <div id="jump" class="chips"></div>

            <div class="results-header">
                <div id="active" class="active-filter"></div>
                <div class="results-side">
                    <span id="count" class="results-count"></span>
                    <a class="section-link" href="search.html">بحث متقدم</a>
                </div>
            </div>

            <div id="content"></div>

            <div class="more-wrap">
                <button id="more" type="button" class="btn secondary hidden">تحميل المزيد</button>
            </div>

        </div>
    </main>

    <div id="app-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>
    <script src="js/taxonomy.js"></script>
    <script src="js/browse.js"></script>
</body>
</html>
