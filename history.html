<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — سجل القراءة"
    >

    <title>VORTEX — سجل القراءة</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

</head>

<body data-page="history">

    <div id="app-header"></div>

    <main>

        <div class="container">

            <section class="page-title">

                <span class="eyebrow">
                    نشاط القراءة
                </span>

                <h1>
                    سجل القراءة
                </h1>

                <p>
                    تابع الفصول التي بدأت بقراءتها مؤخرًا.
                </p>

            </section>


            <section class="history-toolbar">

                <div>

                    <span
                        id="history-count"
                        class="results-count"
                    >
                        0 فصل
                    </span>

                </div>

                <button
                    id="clear-history"
                    type="button"
                    class="btn secondary"
                >
                    مسح السجل
                </button>

            </section>


            <section>

                <div
                    id="history-list"
                    class="history-list"
                ></div>


                <div
                    id="history-empty"
                    class="empty"
                >

                    <div class="empty-icon">
                        ↻
                    </div>

                    <h3>
                        سجل القراءة فارغ
                    </h3>

                    <p>
                        عندما تبدأ بقراءة فصل، سيظهر هنا لتتمكن من العودة إليه بسهولة.
                    </p>

                    <a
                        href="browse.html"
                        class="btn primary"
                    >
                        تصفح المانجا
                    </a>

                </div>


                <div
                    id="history-loading"
                    class="empty"
                    style="display:none;"
                >

                    <div class="loading-spinner"></div>

                    <p>
                        جارٍ تحميل سجل القراءة...
                    </p>

                </div>

            </section>

        </div>

    </main>


    <div id="app-footer"></div>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const historyList =
                    document.getElementById(
                        "history-list"
                    );

                const emptyState =
                    document.getElementById(
                        "history-empty"
                    );

                const loadingState =
                    document.getElementById(
                        "history-loading"
                    );

                const countLabel =
                    document.getElementById(
                        "history-count"
                    );

                const clearButton =
                    document.getElementById(
                        "clear-history"
                    );


                const STORAGE_KEY =
                    "vortexReadingHistory";


                function getHistory() {

                    try {

                        const saved =
                            localStorage.getItem(
                                STORAGE_KEY
                            );

                        if (!saved) {
                            return [];
                        }

                        const parsed =
                            JSON.parse(saved);

                        return Array.isArray(parsed)
                            ? parsed
                            : [];

                    } catch (error) {

                        console.error(
                            "VORTEX history error:",
                            error
                        );

                        return [];
                    }
                }


                function saveHistory(
                    history
                ) {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(history)
                    );
                }


                function removeHistoryItem(
                    chapterId
                ) {

                    const history =
                        getHistory().filter(
                            item =>
                                String(
                                    item.chapter_id ||
                                    item.chapterId ||
                                    item.id
                                ) !==
                                String(chapterId)
                        );

                    saveHistory(history);

                    renderHistory();
                }


                function renderHistory() {

                    const history =
                        getHistory();

                    countLabel.textContent =
                        `${history.length} فصل`;

                    historyList.innerHTML = "";

                    if (
                        history.length === 0
                    ) {

                        emptyState.style.display =
                            "block";

                        clearButton.disabled =
                            true;

                        return;
                    }


                    emptyState.style.display =
                        "none";

                    clearButton.disabled =
                        false;


                    history.forEach(
                        (item) => {

                            const chapterId =
                                item.chapter_id ||
                                item.chapterId ||
                                item.id;

                            if (!chapterId) {
                                return;
                            }


                            const mangaTitle =
                                item.manga_title ||
                                item.manga_name ||
                                "مانجا";


                            const chapterNumber =
                                item.chapter_number ??
                                item.number ??
                                "";


                            const chapterTitle =
                                item.chapter_title ||
                                item.title ||
                                (
                                    chapterNumber
                                        ? `الفصل ${chapterNumber}`
                                        : "الفصل"
                                );


                            const cover =
                                item.cover ||
                                item.cover_url ||
                                item.image ||
                                "assets/boruto-cover.jpg";


                            const progress =
                                Number(
                                    item.progress || 0
                                );


                            const updatedAt =
                                item.updated_at ||
                                item.last_read_at ||
                                item.date;


                            const card =
                                document.createElement(
                                    "article"
                                );

                            card.className =
                                "history-item";


                            card.innerHTML = `

                                <a
                                    class="history-cover"
                                    href="reader-2.html?chapter=${encodeURIComponent(
                                        chapterId
                                    )}"
                                >

                                    <img
                                        src="${escapeHTML(
                                            cover
                                        )}"
                                        alt="${escapeHTML(
                                            mangaTitle
                                        )}"
                                        loading="lazy"
                                    >

                                </a>


                                <div class="history-content">

                                    <span class="eyebrow">
                                        ${escapeHTML(
                                            mangaTitle
                                        )}
                                    </span>


                                    <h2>
                                        ${escapeHTML(
                                            chapterTitle
                                        )}
                                    </h2>


                                    ${
                                        chapterNumber
                                            ? `
                                                <p class="history-chapter-number">
                                                    الفصل ${escapeHTML(
                                                        chapterNumber
                                                    )}
                                                </p>
                                            `
                                            : ""
                                    }


                                    ${
                                        progress > 0
                                            ? `
                                                <div class="history-progress">

                                                    <div class="progress-track">

                                                        <span
                                                            style="width:${Math.min(
                                                                100,
                                                                Math.max(
                                                                    0,
                                                                    progress
                                                                )
                                                            )}%"
                                                        ></span>

                                                    </div>

                                                    <small>
                                                        ${Math.round(
                                                            Math.min(
                                                                100,
                                                                Math.max(
                                                                    0,
                                                                    progress
                                                                )
                                                            )
                                                        )}%
                                                    </small>

                                                </div>
                                            `
                                            : ""
                                    }


                                    ${
                                        updatedAt
                                            ? `
                                                <time>
                                                    آخر قراءة:
                                                    ${formatDate(
                                                        updatedAt
                                                    )}
                                                </time>
                                            `
                                            : ""
                                    }

                                </div>


                                <div class="history-actions">

                                    <a
                                        href="reader-2.html?chapter=${encodeURIComponent(
                                            chapterId
                                        )}"
                                        class="btn primary"
                                    >
                                        متابعة القراءة
                                    </a>


                                    <button
                                        type="button"
                                        class="text-button remove-history"
                                        data-id="${escapeHTML(
                                            chapterId
                                        )}"
                                    >
                                        إزالة
                                    </button>

                                </div>

                            `;


                            historyList.appendChild(
                                card
                            );

                        }
                    );


                    historyList
                        .querySelectorAll(
                            ".remove-history"
                        )
                        .forEach(
                            button => {

                                button.addEventListener(
                                    "click",
                                    () => {

                                        removeHistoryItem(
                                            button.dataset.id
                                        );

                                    }
                                );

                            }
                        );
                }


                function formatDate(
                    value
                ) {

                    const date =
                        new Date(value);

                    if (
                        Number.isNaN(
                            date.getTime()
                        )
                    ) {

                        return value;

                    }


                    return new Intl.DateTimeFormat(
                        "ar-IQ",
                        {
                            year: "numeric",
                            month: "long",
                            day: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    ).format(date);
                }


                function escapeHTML(
                    value
                ) {

                    return String(
                        value ?? ""
                    )
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );
                }


                clearButton.addEventListener(
                    "click",
                    () => {

                        const history =
                            getHistory();

                        if (
                            history.length === 0
                        ) {
                            return;
                        }


                        const confirmed =
                            window.confirm(
                                "هل تريد مسح سجل القراءة بالكامل؟"
                            );


                        if (!confirmed) {
                            return;
                        }


                        localStorage.removeItem(
                            STORAGE_KEY
                        );


                        renderHistory();

                    }
                );


                renderHistory();

            }
        );

    </script>

</body>

</html>
