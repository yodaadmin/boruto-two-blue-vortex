<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — مكتبتي"
    >

    <title>VORTEX — مكتبتي</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/library.css"
    >

</head>

<body data-page="library">

    <div id="app-header"></div>

    <main>

        <div class="container">

            <section class="page-title">

                <span class="eyebrow">
                    المكتبة
                </span>

                <h1>
                    مكتبتي
                </h1>

                <p>
                    الأعمال التي حفظتها للعودة إليها لاحقًا.
                </p>

            </section>


            <section class="library-toolbar">

                <div>

                    <span
                        id="library-count"
                        class="results-count"
                    >
                        0 عمل
                    </span>

                </div>


                <div class="library-filters">

                    <button
                        type="button"
                        class="library-filter active"
                        data-filter="all"
                    >
                        الكل
                    </button>

                    <button
                        type="button"
                        class="library-filter"
                        data-filter="reading"
                    >
                        أقرأها
                    </button>

                    <button
                        type="button"
                        class="library-filter"
                        data-filter="completed"
                    >
                        مكتملة
                    </button>

                </div>

            </section>


            <section>

                <div
                    id="library-results"
                    class="manga-grid"
                ></div>


                <div
                    id="library-empty"
                    class="empty"
                >

                    <div class="empty-icon">
                        ▣
                    </div>

                    <h3>
                        مكتبتك فارغة
                    </h3>

                    <p>
                        أضف الأعمال التي تريد متابعتها إلى مكتبتك.
                    </p>

                    <a
                        href="browse.html"
                        class="btn primary"
                    >
                        تصفح المانجا
                    </a>

                </div>


                <div
                    id="library-no-results"
                    class="empty hidden"
                >

                    <div class="empty-icon">
                        ◌
                    </div>

                    <h3>
                        لا توجد أعمال هنا
                    </h3>

                    <p>
                        لا توجد أعمال مطابقة للتصفية الحالية.
                    </p>

                </div>


                <div
                    id="library-loading"
                    class="empty"
                    style="display:none;"
                >

                    <div class="loading-spinner"></div>

                    <p>
                        جارٍ تحميل المكتبة...
                    </p>

                </div>

            </section>

        </div>

    </main>


    <div id="app-footer"></div>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>
    <script src="js/library.js"></script>

</body>

</html>
