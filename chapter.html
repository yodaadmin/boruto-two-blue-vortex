<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — معلومات الفصل"
    >

    <title>VORTEX — الفصل</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/manga.css"
    >

</head>

<body data-page="chapter">

    <div id="app-header"></div>

    <main>

        <div class="container">

            <section
                id="chapter-page"
                class="chapter-page"
            >

                <div
                    id="chapter-loading"
                    class="empty"
                >

                    <div class="loading-spinner"></div>

                    <h3>
                        جارٍ تحميل الفصل...
                    </h3>

                    <p>
                        انتظر لحظات.
                    </p>

                </div>

                <div
                    id="chapter-content"
                    class="hidden"
                >

                    <div class="chapter-header">

                        <a
                            id="chapter-manga-link"
                            href="manga.html"
                            class="back-link"
                        >
                            ← العودة إلى المانجا
                        </a>

                        <div class="chapter-heading">

                            <span
                                class="eyebrow"
                                id="chapter-manga-name"
                            >
                                المانجا
                            </span>

                            <h1 id="chapter-title">
                                الفصل
                            </h1>

                            <p id="chapter-description"></p>

                        </div>

                    </div>

                    <div class="chapter-info-grid">

                        <div class="info-card">

                            <span class="info-label">
                                رقم الفصل
                            </span>

                            <strong id="chapter-number">
                                —
                            </strong>

                        </div>

                        <div class="info-card">

                            <span class="info-label">
                                تاريخ الإضافة
                            </span>

                            <strong id="chapter-date">
                                —
                            </strong>

                        </div>

                        <div class="info-card">

                            <span class="info-label">
                                عدد الصفحات
                            </span>

                            <strong id="chapter-pages">
                                —
                            </strong>

                        </div>

                        <div class="info-card">

                            <span class="info-label">
                                اللغة
                            </span>

                            <strong>
                                العربية
                            </strong>

                        </div>

                    </div>

                    <div class="chapter-actions">

                        <a
                            id="read-chapter"
                            href="#"
                            class="btn primary"
                        >
                            قراءة الفصل
                        </a>

                        <a
                            id="previous-chapter"
                            href="#"
                            class="btn secondary hidden"
                        >
                            الفصل السابق
                        </a>

                        <a
                            id="next-chapter"
                            href="#"
                            class="btn secondary hidden"
                        >
                            الفصل التالي
                        </a>

                    </div>

                    <div
                        id="chapter-report"
                        class="chapter-tools"
                    >

                        <button
                            type="button"
                            id="report-chapter"
                            class="text-button"
                        >
                            الإبلاغ عن مشكلة في الفصل
                        </button>

                    </div>

                </div>

                <div
                    id="chapter-error"
                    class="empty hidden"
                >

                    <div class="empty-icon">
                        ◌
                    </div>

                    <h3>
                        لم يتم العثور على الفصل
                    </h3>

                    <p>
                        قد يكون الرابط غير صحيح أو أن الفصل غير متاح حاليًا.
                    </p>

                    <a
                        href="index.html"
                        class="btn primary"
                    >
                        العودة إلى الرئيسية
                    </a>

                </div>

            </section>

        </div>

    </main>

    <div id="app-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const chapterId =
                    params.get("chapter");

                const loading =
                    document.getElementById(
                        "chapter-loading"
                    );

                const content =
                    document.getElementById(
                        "chapter-content"
                    );

                const errorBox =
                    document.getElementById(
                        "chapter-error"
                    );

                if (!chapterId) {

                    loading.classList.add("hidden");

                    errorBox.classList.remove("hidden");

                    return;
                }

                try {

                    const chapter =
                        await VortexAPI.getChapter(
                            chapterId
                        );

                    if (!chapter) {
                        throw new Error(
                            "Chapter not found"
                        );
                    }

                    const mangaName =
                        chapter.manga_title ||
                        chapter.manga_name ||
                        chapter.title ||
                        "المانجا";

                    const chapterNumber =
                        chapter.chapter_number ??
                        chapter.number ??
                        "";

                    const chapterTitle =
                        chapter.title ||
                        (
                            chapterNumber
                                ? `الفصل ${chapterNumber}`
                                : "الفصل"
                        );

                    const description =
                        chapter.description ||
                        "";

                    const chapterDate =
                        chapter.created_at ||
                        chapter.date ||
                        "";

                    const pages =
                        chapter.pages ||
                        chapter.page_count ||
                        [];

                    document.title =
                        `VORTEX — ${chapterTitle}`;

                    document.getElementById(
                        "chapter-manga-name"
                    ).textContent =
                        mangaName;

                    document.getElementById(
                        "chapter-title"
                    ).textContent =
                        chapterTitle;

                    document.getElementById(
                        "chapter-description"
                    ).textContent =
                        description;

                    document.getElementById(
                        "chapter-number"
                    ).textContent =
                        chapterNumber
                            ? `الفصل ${chapterNumber}`
                            : "—";

                    document.getElementById(
                        "chapter-pages"
                    ).textContent =
                        Array.isArray(pages)
                            ? pages.length
                            : (
                                Number.isFinite(
                                    Number(pages)
                                )
                                    ? Number(pages)
                                    : "—"
                            );

                    document.getElementById(
                        "chapter-date"
                    ).textContent =
                        formatChapterDate(
                            chapterDate
                        );

                    const mangaId =
                        chapter.manga_id ||
                        chapter.mangaId;

                    if (mangaId) {

                        document.getElementById(
                            "chapter-manga-link"
                        ).href =
                            `manga.html?id=${encodeURIComponent(
                                mangaId
                            )}`;

                    }

                    const readerURL =
                        `reader-2.html?chapter=${encodeURIComponent(
                            chapterId
                        )}`;

                    document.getElementById(
                        "read-chapter"
                    ).href =
                        readerURL;

                    setupNavigation(
                        chapter,
                        mangaId
                    );

                    loading.classList.add(
                        "hidden"
                    );

                    content.classList.remove(
                        "hidden"
                    );

                } catch (error) {

                    console.error(
                        "VORTEX chapter error:",
                        error
                    );

                    loading.classList.add(
                        "hidden"
                    );

                    content.classList.add(
                        "hidden"
                    );

                    errorBox.classList.remove(
                        "hidden"
                    );
                }


                function formatChapterDate(
                    value
                ) {

                    if (!value) {
                        return "—";
                    }

                    const date =
                        new Date(value);

                    if (
                        Number.isNaN(
                            date.getTime()
                        )
                    ) {
                        return value;
                    }

                    return new Intl.DateTimeFormat(
                        "ar-IQ",
                        {
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    ).format(date);
                }


                function setupNavigation(
                    chapter,
                    mangaId
                ) {

                    const previous =
                        chapter.previous_chapter ||
                        chapter.previousChapter;

                    const next =
                        chapter.next_chapter ||
                        chapter.nextChapter;

                    const previousButton =
                        document.getElementById(
                            "previous-chapter"
                        );

                    const nextButton =
                        document.getElementById(
                            "next-chapter"
                        );

                    if (previous) {

                        const previousId =
                            typeof previous === "object"
                                ? (
                                    previous.id ||
                                    previous.chapter_id
                                )
                                : previous;

                        if (previousId) {

                            previousButton.href =
                                `chapter.html?chapter=${encodeURIComponent(
                                    previousId
                                )}`;

                            previousButton.classList.remove(
                                "hidden"
                            );
                        }
                    }

                    if (next) {

                        const nextId =
                            typeof next === "object"
                                ? (
                                    next.id ||
                                    next.chapter_id
                                )
                                : next;

                        if (nextId) {

                            nextButton.href =
                                `chapter.html?chapter=${encodeURIComponent(
                                    nextId
                                )}`;

                            nextButton.classList.remove(
                                "hidden"
                            );
                        }
                    }
                }


                document
                    .getElementById(
                        "report-chapter"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            const subject =
                                encodeURIComponent(
                                    `مشكلة في الفصل ${chapterId}`
                                );

                            window.location.href =
                                `mailto:?subject=${subject}`;

                        }
                    );

            }
        );

    </script>

</body>
</html>
