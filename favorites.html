<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — المفضلة"
    >

    <title>VORTEX — المفضلة</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/library.css"
    >

</head>

<body data-page="favorites">

    <div id="app-header"></div>

    <main>

        <div class="container">

            <section class="page-title">

                <span class="eyebrow">
                    المحفوظات
                </span>

                <h1>
                    المفضلة
                </h1>

                <p>
                    الأعمال التي أضفتها إلى قائمة المفضلة.
                </p>

            </section>


            <section class="library-toolbar">

                <div>

                    <span
                        id="favorites-count"
                        class="results-count"
                    >
                        0 عمل
                    </span>

                </div>


                <select
                    id="favorites-sort"
                    class="library-sort"
                    aria-label="ترتيب المفضلة"
                >

                    <option value="recent">
                        أضيفت مؤخرًا
                    </option>

                    <option value="title">
                        حسب الاسم
                    </option>

                    <option value="rating">
                        حسب التقييم
                    </option>

                </select>

            </section>


            <section>

                <div
                    id="favorites-results"
                    class="manga-grid"
                ></div>


                <div
                    id="favorites-empty"
                    class="empty"
                >

                    <div class="empty-icon">
                        ★
                    </div>

                    <h3>
                        لا توجد مفضلة
                    </h3>

                    <p>
                        عندما تضيف عملًا إلى المفضلة، سيظهر هنا.
                    </p>

                    <a
                        href="browse.html"
                        class="btn primary"
                    >
                        اكتشف الأعمال
                    </a>

                </div>


                <div
                    id="favorites-loading"
                    class="empty"
                    style="display:none;"
                >

                    <div class="loading-spinner"></div>

                    <p>
                        جارٍ تحميل المفضلة...
                    </p>

                </div>

            </section>

        </div>

    </main>


    <div id="app-footer"></div>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>
    <script src="js/library.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const results =
                    document.getElementById(
                        "favorites-results"
                    );

                const empty =
                    document.getElementById(
                        "favorites-empty"
                    );

                const loading =
                    document.getElementById(
                        "favorites-loading"
                    );

                const count =
                    document.getElementById(
                        "favorites-count"
                    );

                const sort =
                    document.getElementById(
                        "favorites-sort"
                    );


                const STORAGE_KEY =
                    "vortexFavorites";


                function getFavorites() {

                    try {

                        const data =
                            JSON.parse(
                                localStorage.getItem(
                                    STORAGE_KEY
                                ) || "[]"
                            );

                        return Array.isArray(data)
                            ? data
                            : [];

                    } catch {

                        return [];

                    }
                }


                function saveFavorites(
                    items
                ) {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(items)
                    );

                }


                function render() {

                    loading.style.display =
                        "none";

                    let items =
                        getFavorites();


                    count.textContent =
                        `${items.length} عمل`;


                    results.innerHTML = "";


                    if (!items.length) {

                        empty.style.display =
                            "block";

                        return;

                    }


                    empty.style.display =
                        "none";


                    const sortValue =
                        sort.value;


                    if (
                        sortValue === "title"
                    ) {

                        items.sort(
                            (a, b) =>
                                String(
                                    a.title ||
                                    a.name ||
                                    ""
                                ).localeCompare(
                                    String(
                                        b.title ||
                                        b.name ||
                                        ""
                                    ),
                                    "ar"
                                )
                        );

                    }


                    if (
                        sortValue === "rating"
                    ) {

                        items.sort(
                            (a, b) =>
                                Number(
                                    b.rating || 0
                                ) -
                                Number(
                                    a.rating || 0
                                )
                        );

                    }


                    items.forEach(
                        item => {

                            const id =
                                item.id ||
                                item.manga_id ||
                                item.mangaId;

                            if (!id) {
                                return;
                            }


                            const title =
                                item.title ||
                                item.name ||
                                "مانجا";


                            const cover =
                                item.cover ||
                                item.cover_url ||
                                item.image ||
                                "assets/boruto-cover.jpg";


                            const status =
                                item.status ||
                                "";


                            const card =
                                document.createElement(
                                    "article"
                                );


                            card.className =
                                "manga-card";


                            card.innerHTML = `

                                <a
                                    href="manga.html?id=${encodeURIComponent(
                                        id
                                    )}"
                                    class="manga-cover"
                                >

                                    <img
                                        src="${escapeHTML(
                                            cover
                                        )}"
                                        alt="${escapeHTML(
                                            title
                                        )}"
                                        loading="lazy"
                                    >

                                </a>


                                <div class="manga-card-body">

                                    <span class="eyebrow">
                                        ${escapeHTML(
                                            status
                                        )}
                                    </span>


                                    <h3>
                                        <a
                                            href="manga.html?id=${encodeURIComponent(
                                                id
                                            )}"
                                        >
                                            ${escapeHTML(
                                                title
                                            )}
                                        </a>
                                    </h3>


                                    ${
                                        item.rating
                                            ? `
                                                <span class="manga-rating">
                                                    ★ ${escapeHTML(
                                                        item.rating
                                                    )}
                                                </span>
                                            `
                                            : ""
                                    }


                                    <button
                                        type="button"
                                        class="text-button remove-favorite"
                                        data-id="${escapeHTML(
                                            id
                                        )}"
                                    >
                                        إزالة من المفضلة
                                    </button>

                                </div>

                            `;


                            results.appendChild(
                                card
                            );

                        }
                    );


                    results
                        .querySelectorAll(
                            ".remove-favorite"
                        )
                        .forEach(
                            button => {

                                button.addEventListener(
                                    "click",
                                    () => {

                                        removeFavorite(
                                            button.dataset.id
                                        );

                                    }
                                );

                            }
                        );

                }


                function removeFavorite(
                    id
                ) {

                    const items =
                        getFavorites().filter(
                            item =>
                                String(
                                    item.id ||
                                    item.manga_id ||
                                    item.mangaId
                                ) !==
                                String(id)
                        );


                    saveFavorites(items);

                    render();

                }


                function escapeHTML(
                    value
                ) {

                    return String(
                        value ?? ""
                    )
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                sort.addEventListener(
                    "change",
                    render
                );


                render();

            }
        );

    </script>

</body>

</html>
