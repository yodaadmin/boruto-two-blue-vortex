<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>VORTEX — قارئ الفصل</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#05070b;--bar:#070b0ee8;--panel:#0b1117;--line:#21313a;--text:#f4f8fa;--muted:#8999a1;--cyan:#13abd2;--cyan2:#76e5fd;--page-width:920px;--gap:12px;--brightness:1}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}body{overflow-x:hidden;transition:background .3s,color .3s}body[data-theme="light"]{--bg:#e8edf0;--bar:#f7f9faee;--panel:#fff;--line:#c9d4d9;--text:#10171b;--muted:#62737b}body[data-theme="sepia"]{--bg:#e9dfc9;--bar:#f5eddcee;--panel:#f4ead7;--line:#cbbda6;--text:#302820;--muted:#756957}.bar{position:sticky;top:0;z-index:50;min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);transition:transform .3s}.bar.hidden{transform:translateY(-100%)}.back{justify-self:start;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:var(--panel);font-weight:850;text-decoration:none;color:inherit}.mark{width:28px;height:28px;object-fit:contain}.heading{text-align:center;min-width:0}.heading small{display:block;color:var(--muted);font-size:9px;letter-spacing:.22em}.heading b{display:block;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.tools{justify-self:end;display:flex;gap:6px}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:inherit;cursor:pointer;font-weight:900}.icon:hover{border-color:var(--cyan);color:var(--cyan2)}
.progress{position:fixed;z-index:80;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--cyan2));box-shadow:0 0 15px #13abd2;direction:ltr}.reader{min-height:100vh;padding:18px 0 120px;display:flex;flex-direction:column;align-items:center;gap:var(--gap)}.page{width:min(var(--page-width),100%);line-height:0;position:relative;text-align:center}.page img{display:block;width:100%;height:auto;margin:auto;filter:brightness(var(--brightness));user-select:none;-webkit-user-drag:none;box-shadow:0 0 0 1px #0008}.reader.single .page{display:none}.reader.single .page.active{display:block;width:auto;max-width:calc(100vw - 24px)}.reader.single .page.active img{width:auto;max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;box-shadow:0 25px 80px #000b}.status{padding:90px 22px;text-align:center;color:var(--muted);line-height:2}.status .spin{width:55px;height:55px;margin:0 auto 20px;background:url('assets/vortex-mark-cyan.png') center/contain no-repeat;animation:spin 4s linear infinite}.status.error{color:#e88994}.bottom{position:fixed;z-index:60;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;border:1px solid var(--line);border-radius:15px;background:var(--bar);backdrop-filter:blur(18px);box-shadow:0 20px 70px #000b}.bottom button{border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.counter{min-width:125px;text-align:center;color:var(--muted);font-size:12px}.drawer{position:fixed;z-index:70;top:0;right:0;width:min(390px,94vw);height:100dvh;background:#071016f5;border-left:1px solid #20333c;transform:translateX(110%);transition:.28s;backdrop-filter:blur(22px);padding:22px;overflow:auto;box-shadow:-30px 0 100px #000b}.drawer.open{transform:none}.drawer h2{margin:0 0 4px}.drawer p{color:#7e9098;font-size:12px}.setting{padding:17px 0;border-bottom:1px solid #1c2b32}.setting label{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800}.setting select,.setting input[type=range]{width:100%;margin-top:10px}.setting select{background:#0a1217;border:1px solid #24343c;color:#fff;padding:10px;border-radius:10px}.range-row{display:flex;align-items:center;gap:10px}.range-row input{flex:1}.value{color:var(--cyan2);font-size:12px;min-width:45px;text-align:left}.drawer-close{position:absolute;left:16px;top:16px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switches button{padding:11px;border:1px solid #26373f;background:#0b1419;color:#b8c7cc;border-radius:10px;cursor:pointer}.switches button.active{background:#13abd21a;border-color:#13abd2;color:#76e5fd}.drawer .action{width:100%;padding:12px;margin-top:10px;border:1px solid #26373f;background:#0b1419;color:#fff;border-radius:11px;font-weight:850}.chapter-nav{position:fixed;z-index:40;top:78px;left:50%;transform:translateX(-50%);display:flex;gap:7px;opacity:0;pointer-events:none;transition:.25s}.chapter-nav.show{opacity:1;pointer-events:auto}.chapter-nav a{padding:8px 12px;border:1px solid var(--line);background:var(--bar);backdrop-filter:blur(14px);border-radius:10px;font-size:12px}.resume{position:fixed;z-index:45;left:50%;top:84px;transform:translateX(-50%);padding:10px 13px;background:#08151beF;border:1px solid #2a5561;border-radius:11px;color:#dffaff;font-size:12px;box-shadow:0 15px 50px #0008}.resume.hide{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){.heading b{font-size:12px;max-width:46vw}.back span{display:none}.bottom{bottom:8px;width:calc(100% - 16px);justify-content:center}.counter{flex:1;min-width:0}.reader{padding-top:6px}.drawer{width:100%}}
</style></head><body>
<div id="progress" class="progress"></div><header id="bar" class="bar"><a class="back" href="index.html#chapters"><img class="mark" src="assets/vortex-mark-white.png" alt=""><span>الفصول</span>‹</a><div class="heading"><small>VORTEX MANGA READER</small><b id="chapterTitle">جاري التحميل...</b></div><div class="tools"><button class="icon" id="settings" title="إعدادات القراءة">⚙</button><button class="icon" id="fullscreen" title="ملء الشاشة">⛶</button></div></header>
<div id="chapterNav" class="chapter-nav"><a id="prevChapter">‹ السابق</a><a id="nextChapter">التالي ›</a></div><div id="resume" class="resume hide">تم حفظ تقدمك — يمكنك متابعة القراءة من آخر موضع.</div><main id="reader" class="reader"><div class="status"><div class="spin"></div>جاري تحميل الصفحات...</div></main>
<div class="bottom"><button id="prev">‹</button><span id="counter" class="counter">—</span><button id="next">›</button></div>
<aside id="drawer" class="drawer"><button class="icon drawer-close" id="closeSettings">×</button><div style="padding-top:35px"><div class="kicker" style="color:#76e5fd;font-size:10px;letter-spacing:.2em;font-weight:900">READER CONTROL</div><h2>إعدادات القراءة</h2><p>كل إعداد يُحفظ تلقائيًا على جهازك.</p><div class="setting"><label>وضع القراءة</label><div class="switches" style="margin-top:10px"><button id="verticalMode">عمودي</button><button id="singleMode">صفحة واحدة</button></div></div><div class="setting"><label>الخلفية</label><select id="theme"><option value="dark">Obsidian — داكن</option><option value="sepia">Sepia — دافئ</option><option value="light">Light — فاتح</option></select></div><div class="setting"><label>عرض الصفحة <span class="value" id="widthValue">920px</span></label><div class="range-row"><input id="width" type="range" min="420" max="1400" step="10"><span class="value">px</span></div></div><div class="setting"><label>الفاصل بين الصفحات <span class="value" id="gapValue">12px</span></label><input id="gap" type="range" min="0" max="40" step="1"></div><div class="setting"><label>سطوع الصفحات <span class="value" id="brightValue">100%</span></label><input id="brightness" type="range" min="70" max="120" step="1"></div><div class="setting"><label>الملاءمة</label><select id="fit"><option value="width">عرض كامل</option><option value="screen">ارتفاع الشاشة — صفحة واحدة</option></select></div><button class="action" id="reset">إعادة الإعدادات الافتراضية</button><button class="action" id="hideBar">إخفاء الشريط أثناء القراءة</button></div></aside>
<script>
const SUPABASE_URL='https://smgvqaunvvkbwkkgmccx.supabase.co',SUPABASE_KEY='sb_publishable_S7Wd8d7OGc1m7bsHY4Awnw_ToSxY_j6',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const requested=new URLSearchParams(location.search).get('chapter');const resumeRequested=new URLSearchParams(location.search).get('resume')==='1';const SETTINGS='vortex.reader.settings',HISTORY='vortex.reading';let pages=[],index=0,mode='vertical',chapterNumber=Number(requested),chapterList=[];let settings={mode:'vertical',theme:'dark',width:920,gap:12,brightness:100,fit:'width',hideBar:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function publicUrl(path){return `${SUPABASE_URL}/storage/v1/object/public/manga-pages/${String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/')}`}function loadSettings(){try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch{}}function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(settings))}function history(){try{return JSON.parse(localStorage.getItem(HISTORY)||'{}')}catch{return {}}}function saveProgress(){const h=history();h[String(chapterNumber)]={page:index+1,percent:pages.length?((index+1)/pages.length)*100:0,updatedAt:Date.now()};localStorage.setItem(HISTORY,JSON.stringify(h))}
function applySettings(){document.documentElement.style.setProperty('--page-width',settings.width+'px');document.documentElement.style.setProperty('--gap',settings.gap+'px');document.documentElement.style.setProperty('--brightness',(settings.brightness/100).toFixed(2));document.body.dataset.theme=settings.theme;document.getElementById('width').value=settings.width;document.getElementById('gap').value=settings.gap;document.getElementById('brightness').value=settings.brightness;document.getElementById('widthValue').textContent=settings.width+'px';document.getElementById('gapValue').textContent=settings.gap+'px';document.getElementById('brightValue').textContent=settings.brightness+'%';document.getElementById('theme').value=settings.theme;document.getElementById('fit').value=settings.fit;setMode(settings.mode,false);if(settings.hideBar)document.getElementById('bar').classList.add('hidden')}
function setMode(m,save=true){mode=m;settings.mode=m;document.getElementById('reader').classList.toggle('single',m==='single');document.getElementById('verticalMode').classList.toggle('active',m==='vertical');document.getElementById('singleMode').classList.toggle('active',m==='single');if(m==='single')setSingle(index,false);if(save){saveSettings();}}
function setSingle(i,save=true){index=Math.max(0,Math.min(pages.length-1,i));document.querySelectorAll('.page').forEach((p,n)=>p.classList.toggle('active',n===index));updateUI();if(save)saveProgress()}
function updateUI(){const pct=pages.length?((index+1)/pages.length)*100:0;document.getElementById('progress').style.width=pct+'%';document.getElementById('counter').textContent=mode==='single'?`${index+1} / ${pages.length}`:`${Math.round(pct)}% · ${pages.length} صفحة`;saveProgress()}
function scrollProgress(){if(mode!=='vertical')return;const max=document.documentElement.scrollHeight-innerHeight;const y=Math.max(0,Math.min(max,scrollY));const pct=max?y/max:0;document.getElementById('progress').style.width=(pct*100)+'%';const visible=Math.min(pages.length-1,Math.max(0,Math.round(pct*Math.max(0,pages.length-1))));if(visible!==index){index=visible;document.getElementById('counter').textContent=`${Math.round(pct*100)}% · ${pages.length} صفحة`;saveProgress()}}
function build(){const r=document.getElementById('reader');r.innerHTML='';pages.forEach((p,i)=>{const wrap=document.createElement('div');wrap.className='page';const img=document.createElement('img');img.src=p.url;img.alt=`صفحة ${p.page}`;img.loading=i<2?'eager':'lazy';img.draggable=false;img.onerror=()=>{wrap.innerHTML=`<div class="status error">تعذر تحميل الصفحة ${esc(p.page)}</div>`};wrap.appendChild(img);r.appendChild(wrap)});if(mode==='single')setSingle(index,false);else restoreVertical();updateUI()}
function restoreVertical(){const h=history()[String(chapterNumber)];if(resumeRequested&&h?.page>1){setTimeout(()=>{const target=document.querySelectorAll('.page')[Math.min(pages.length-1,h.page-1)];target?.scrollIntoView({block:'start'});document.getElementById('resume').classList.add('hide')},250)}else if(h?.page>1){document.getElementById('resume').classList.remove('hide');setTimeout(()=>document.getElementById('resume').classList.add('hide'),5000)}}
async function init(){try{loadSettings();applySettings();if(!requested)throw Error('رقم الفصل غير موجود في الرابط.');const n=Number(requested);if(!Number.isInteger(n)||n<1)throw Error('رقم الفصل غير صالح.');const ch=await db.from('chapters').select('id,number,title,published_at').eq('number',n).maybeSingle();if(ch.error)throw ch.error;if(!ch.data)throw Error('لم يتم العثور على الفصل '+n);chapterNumber=n;document.getElementById('chapterTitle').textContent=`الفصل ${n} — ${ch.data.title||''}`;const pg=await db.from('pages').select('id,page_number,storage_path').eq('chapter_id',ch.data.id).order('page_number',{ascending:true});if(pg.error)throw pg.error;pages=(pg.data||[]).map(x=>({page:x.page_number,path:x.storage_path,url:publicUrl(x.storage_path)}));if(!pages.length)throw Error('لا توجد صفحات منشورة لهذا الفصل.');const list=await db.from('chapters').select('number,title').order('number',{ascending:true});chapterList=(list.data||[]).map(x=>Number(x.number)).filter(Number.isFinite);const pos=chapterList.indexOf(n);const prev=pos>0?chapterList[pos-1]:null,next=pos>=0&&pos<chapterList.length-1?chapterList[pos+1]:null;const pbtn=document.getElementById('prevChapter'),nbtn=document.getElementById('nextChapter');if(prev){pbtn.href=`reader.html?chapter=${prev}`}else{pbtn.style.display='none'}if(next){nbtn.href=`reader.html?chapter=${next}`}else{nbtn.style.display='none'}build()}catch(e){document.getElementById('reader').innerHTML=`<div class="status error"><div class="spin"></div><h3>تعذر فتح الفصل</h3>${esc(e.message||e)}</div>`}}
function step(dir){if(mode==='single'){const next=index+dir;if(next>=0&&next<pages.length)setSingle(next)}else{window.scrollBy({top:dir*(innerHeight*.88),behavior:'smooth'})}}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('verticalMode').onclick=()=>setMode('vertical');document.getElementById('singleMode').onclick=()=>setMode('single');document.getElementById('settings').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('closeSettings').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('theme').onchange=e=>{settings.theme=e.target.value;saveSettings();applySettings()};document.getElementById('width').oninput=e=>{settings.width=Number(e.target.value);saveSettings();applySettings()};document.getElementById('gap').oninput=e=>{settings.gap=Number(e.target.value);saveSettings();applySettings()};document.getElementById('brightness').oninput=e=>{settings.brightness=Number(e.target.value);saveSettings();applySettings()};document.getElementById('fit').onchange=e=>{settings.fit=e.target.value;if(e.target.value==='screen'){settings.mode='single';mode='single'}saveSettings();applySettings();build()};document.getElementById('reset').onclick=()=>{settings={mode:'vertical',theme:'dark',width:920,gap:12,brightness:100,fit:'width',hideBar:false};saveSettings();applySettings();build()};document.getElementById('hideBar').onclick=()=>{settings.hideBar=!settings.hideBar;saveSettings();document.getElementById('bar').classList.toggle('hidden',settings.hideBar);document.getElementById('drawer').classList.remove('open')};window.addEventListener('scroll',scrollProgress,{passive:true});window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}if(e.key==='Escape')document.getElementById('drawer').classList.remove('open')});let touchX=0;window.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});window.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>65){if(document.getElementById('drawer').classList.contains('open'))return;step(dx<0?1:-1)}},{passive:true});init();
</script></body></html>
