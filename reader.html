<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">

<title>قارئ الفصل — دوامتان زرقاوتان</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  background:#05080c;
  color:#fff;

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  transition:
    background .3s ease,
    color .3s ease;
}

html{
  scroll-behavior:smooth;
}

body{
  overflow-x:hidden;
}

button,
select,
a{
  font:inherit;
}


/* =========================================================
   TOP READER BAR
========================================================= */

.bar{
  position:sticky;

  top:0;
  z-index:100;

  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:8px 14px;

  background:
    linear-gradient(
      180deg,
      rgba(9,20,30,.96),
      rgba(7,17,27,.91)
    );

  border-bottom:
    1px solid rgba(118,229,253,.10);

  box-shadow:
    0 8px 30px rgba(0,0,0,.20);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}


/* LEFT / RIGHT GROUPS */

.bar-right,
.bar-left{
  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;
}


/* GENERAL TOP BUTTON */

.bar a,
.bar button,
.bar select{

  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#eaf8fc;

  text-decoration:none;

  background:
    rgba(20,37,50,.82);

  border:
    1px solid rgba(118,229,253,.08);

  border-radius:11px;

  padding:
    0 11px;

  cursor:pointer;

  outline:none;

  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.bar a:hover,
.bar button:hover,
.bar select:hover{

  background:
    rgba(24,52,68,.96);

  border-color:
    rgba(118,229,253,.18);

  box-shadow:
    0 5px 18px rgba(0,0,0,.20);
}

.bar a:active,
.bar button:active{

  transform:
    scale(.96);
}


/* HOME BUTTON */

.home-btn{

  gap:7px;

  white-space:nowrap;

  font-size:12px;
}

.home-icon{

  width:18px;
  height:18px;

  display:grid;
  place-items:center;

  color:#76e5fd;

  font-size:14px;
}


/* SETTINGS BUTTON */

.settings-btn{

  width:36px;

  padding:0 !important;

  font-size:16px;

  position:relative;
}

.settings-btn::before{

  content:"";

  width:7px;
  height:7px;

  border-radius:50%;

  background:#76e5fd;

  position:absolute;

  top:6px;
  right:6px;

  box-shadow:
    0 0 9px rgba(118,229,253,.55);
}


/* FULLSCREEN */

.full-btn{

  width:36px;

  padding:0 !important;

  font-size:17px;
}


/* CHAPTER SELECT */

.chapter-select-wrap{

  position:relative;

  display:flex;
  align-items:center;
}

.chapter-select-wrap::before{

  content:"☰";

  position:absolute;

  right:10px;

  color:#76e5fd;

  font-size:11px;

  pointer-events:none;

  z-index:2;
}

.bar select{

  appearance:none;
  -webkit-appearance:none;

  min-width:118px;
  max-width:145px;

  padding:
    0 28px
    0 11px;

  font-size:11px;

  text-overflow:ellipsis;
}


/* TITLE */

.title{

  min-width:0;

  flex:1;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:1px;

  text-align:center;
}

.title span{

  color:#78909c;

  font-size:9px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  max-width:32vw;
}

.title b{

  color:#eefbff;

  font-size:12px;

  font-weight:650;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  max-width:32vw;
}


/* =========================================================
   READER
========================================================= */

.reader{

  width:100%;

  min-height:
    calc(100vh - 60px);

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:
    0 0 70px;
}


/* PAGE */

.page-wrap{

  width:100%;

  margin:0;
  padding:0;

  text-align:center;

  line-height:0;

  background:transparent;

  transition:
    margin-bottom .2s ease;
}

.reader img{

  display:block;

  width:auto;

  max-width:100%;

  height:auto;

  margin:0 auto;
  padding:0;

  user-select:none;

  -webkit-user-drag:none;

  line-height:0;

  transition:
    filter .2s ease;
}

body.fit-original .reader img{

  max-width:none;
}


/* =========================================================
   SINGLE PAGE MODE
========================================================= */

body.single .reader img{

  display:none;
}

body.single .reader img.active{

  display:block;

  width:auto;

  max-width:100%;

  max-height:
    calc(100vh - 70px);

  object-fit:contain;
}


/* =========================================================
   STATUS
========================================================= */

.status{

  width:min(900px,calc(100% - 30px));

  padding:40px 18px;

  text-align:center;

  color:#9fb2bf;

  font-size:13px;
}

.status.error{

  color:#ff9da8;
}

.status h3{

  margin:
    0 0 10px;

  font-size:17px;
}

.status small{

  color:#8296a4;

  word-break:break-all;
}


/* =========================================================
   SETTINGS BACKDROP
========================================================= */

.settings-backdrop{

  position:fixed;

  inset:0;

  z-index:115;

  background:
    rgba(0,0,0,.20);

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.settings-backdrop.open{

  opacity:1;

  visibility:visible;

  pointer-events:auto;
}


/* =========================================================
   SETTINGS PANEL
========================================================= */

.settings-panel{

  position:fixed;

  top:67px;

  right:14px;

  z-index:120;

  width:
    min(345px,calc(100vw - 28px));

  max-height:
    calc(100vh - 82px);

  overflow-y:auto;

  padding:14px;

  border:
    1px solid rgba(118,229,253,.15);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(10,23,34,.98),
      rgba(6,15,23,.97)
    );

  box-shadow:
    0 25px 80px rgba(0,0,0,.62),
    0 0 35px rgba(19,171,210,.06);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  opacity:0;

  visibility:hidden;

  transform:
    translateY(-8px)
    scale(.97);

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;
}

.settings-panel.open{

  opacity:1;

  visibility:visible;

  transform:
    translateY(0)
    scale(1);
}


/* SETTINGS HEADER */

.settings-title{

  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;

  padding:
    2px 1px 11px;

  border-bottom:
    1px solid rgba(255,255,255,.07);
}

.settings-heading{

  display:flex;

  align-items:center;

  gap:8px;
}

.settings-heading-icon{

  width:28px;
  height:28px;

  display:grid;

  place-items:center;

  border-radius:9px;

  color:#76e5fd;

  background:
    rgba(19,171,210,.10);

  border:
    1px solid rgba(118,229,253,.10);

  font-size:14px;
}

.settings-title strong{

  display:block;

  color:#e9faff;

  font-size:13px;

  font-weight:650;
}

.settings-title small{

  display:block;

  margin-top:2px;

  color:#718792;

  font-size:9px;
}

.settings-close{

  width:28px;
  height:28px;

  display:grid;

  place-items:center;

  border:0;

  border-radius:9px;

  color:#b8cbd4;

  background:#142532;

  cursor:pointer;

  font-size:15px;

  transition:.18s ease;
}

.settings-close:hover{

  color:#fff;

  background:#1b3544;
}


/* SETTINGS SECTIONS */

.settings-section{

  margin-top:12px;
}

.settings-section-title{

  display:flex;

  align-items:center;

  gap:6px;

  margin:
    0 0 5px;

  padding:
    0 2px;

  color:#6f8793;

  font-size:9px;

  font-weight:650;

  letter-spacing:.2px;
}

.settings-section-title::before{

  content:"";

  width:4px;
  height:4px;

  border-radius:50%;

  background:#13abd2;

  box-shadow:
    0 0 7px rgba(19,171,210,.5);
}


/* SETTING ROW */

.setting-row{

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  min-height:42px;

  padding:
    7px 0;

  border-top:
    1px solid rgba(255,255,255,.045);
}

.setting-row:first-of-type{

  border-top:0;
}

.setting-label{

  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;
}

.setting-label-icon{

  width:24px;
  height:24px;

  flex:none;

  display:grid;

  place-items:center;

  border-radius:7px;

  background:
    rgba(255,255,255,.035);

  color:#8da8b4;

  font-size:11px;
}

.setting-label span{

  color:#aebec7;

  font-size:11px;

  white-space:nowrap;
}


/* SETTING ACTIONS */

.setting-actions{

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:4px;

  flex-wrap:wrap;
}

.setting-actions button{

  min-height:27px;

  border:
    1px solid #263c49;

  background:
    rgba(16,31,41,.90);

  color:#cbd9de;

  border-radius:8px;

  padding:
    4px 8px;

  font-size:9.5px;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    transform .15s ease;
}

.setting-actions button:hover{

  background:#173241;

  border-color:
    rgba(118,229,253,.20);
}

.setting-actions button:active{

  transform:
    scale(.95);
}

.setting-actions button.active{

  color:#031015;

  background:#13abd2;

  border-color:#13abd2;

  font-weight:700;

  box-shadow:
    0 4px 14px rgba(19,171,210,.16);
}


/* =========================================================
   SIDE SCRUBBER
========================================================= */

.page-scrubber{

  position:fixed;

  top:60px;
  right:0;
  bottom:0;

  z-index:90;

  width:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.scrubber-hitbox{

  position:absolute;

  top:0;
  right:0;
  bottom:0;

  width:40px;

  pointer-events:auto;
}

.scrubber{

  position:absolute;

  right:5px;

  width:7px;

  height:62vh;

  min-height:190px;
  max-height:680px;

  border-radius:999px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.035);

  opacity:.13;

  cursor:pointer;

  pointer-events:auto;

  transition:
    opacity .2s ease,
    width .2s ease,
    background .2s ease;
}

.scrubber-hitbox:hover .scrubber,
.scrubber:hover,
.scrubber.active{

  opacity:.78;

  width:9px;

  background:
    rgba(19,171,210,.38);

  box-shadow:
    0 0 16px rgba(19,171,210,.12);
}

.scrubber-thumb{

  position:absolute;

  left:50%;

  width:7px;
  height:42px;

  transform:
    translateX(-50%);

  border-radius:999px;

  background:#76e5fd;

  box-shadow:
    0 0 12px rgba(118,229,253,.42);

  pointer-events:none;

  transition:
    top .08s linear;
}


/* SCRUBBER BUTTONS */

.scrubber-top,
.scrubber-bottom{

  position:absolute;

  right:-1px;

  width:25px;
  height:25px;

  display:grid;

  place-items:center;

  border-radius:50%;

  background:
    rgba(7,18,27,.94);

  border:
    1px solid rgba(118,229,253,.18);

  color:#76e5fd;

  font-size:11px;

  opacity:0;

  transform:
    translateX(5px);

  transition:.2s ease;

  cursor:pointer;

  pointer-events:auto;
}

.scrubber-top{
  top:-37px;
}

.scrubber-bottom{
  bottom:-37px;
}

.scrubber-hitbox:hover .scrubber-top,
.scrubber-hitbox:hover .scrubber-bottom,
.scrubber.active ~ .scrubber-top,
.scrubber.active ~ .scrubber-bottom{

  opacity:1;

  transform:
    translateX(0);
}


/* SCRUBBER COUNTER */

.scrubber-counter{

  position:absolute;

  right:18px;

  top:50%;

  transform:
    translateY(-50%);

  padding:
    5px 8px;

  border-radius:8px;

  background:
    rgba(4,10,15,.94);

  border:
    1px solid rgba(118,229,253,.13);

  color:#dff8ff;

  font-size:9px;

  white-space:nowrap;

  opacity:0;

  pointer-events:none;

  transition:.2s ease;

  box-shadow:
    0 8px 25px rgba(0,0,0,.30);
}

.scrubber-hitbox:hover .scrubber-counter,
.scrubber.active ~ .scrubber-counter{

  opacity:1;
}


/* =========================================================
   END OF CHAPTER
========================================================= */

.chapter-end{

  width:
    min(700px,calc(100% - 28px));

  margin:
    65px auto 20px;

  padding:
    30px 20px;

  text-align:center;

  border:
    1px solid rgba(118,229,253,.12);

  border-radius:20px;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(19,171,210,.12),
      transparent 65%
    ),
    #09131b;

  box-shadow:
    0 25px 80px rgba(0,0,0,.35);
}

.chapter-end h2{

  margin:
    0 0 6px;

  font-size:20px;
}

.chapter-end p{

  margin:
    0 0 18px;

  color:#91a5af;

  font-size:12px;
}

.chapter-end-actions{

  display:flex;

  justify-content:center;

  gap:7px;

  flex-wrap:wrap;
}

.chapter-end-actions button{

  border:
    1px solid #29414e;

  background:#122632;

  color:#fff;

  border-radius:10px;

  padding:
    8px 13px;

  cursor:pointer;

  font-size:11px;

  transition:.2s ease;
}

.chapter-end-actions button:hover{

  background:#13abd2;

  color:#031015;

  border-color:#13abd2;
}


/* =========================================================
   BOTTOM CONTROLS
   ONLY SINGLE PAGE
========================================================= */

.bottom{

  position:fixed;

  bottom:12px;

  left:50%;

  transform:
    translateX(-50%);

  z-index:110;

  display:none;

  align-items:center;

  gap:4px;

  padding:5px;

  border:
    1px solid rgba(118,229,253,.12);

  border-radius:13px;

  background:
    rgba(9,22,32,.90);

  box-shadow:
    0 12px 35px rgba(0,0,0,.42);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.bottom.visible{

  display:flex;
}

.bottom button{

  width:31px;
  height:29px;

  display:grid;

  place-items:center;

  border:0;

  border-radius:8px;

  background:
    rgba(24,48,63,.90);

  color:#e9f9fd;

  cursor:pointer;

  font-size:10px;

  transition:.18s ease;
}

.bottom button:hover{

  background:#13abd2;

  color:#031015;
}

.bottom span{

  min-width:65px;

  text-align:center;

  color:#9fb5bf;

  font-size:9px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .bar{

    height:54px;

    padding:
      6px 8px;

    gap:6px;
  }

  .bar a,
  .bar button,
  .bar select{

    height:34px;

    border-radius:9px;

    padding:
      0 8px;

    font-size:11px;
  }

  .home-btn{

    width:34px;

    padding:0 !important;
  }

  .home-btn-text{

    display:none;
  }

  .chapter-select-wrap::before{

    right:8px;
  }

  .bar select{

    min-width:95px;

    max-width:110px;

    padding-right:24px;
  }

  .title span{

    max-width:24vw;

    font-size:8px;
  }

  .title b{

    max-width:25vw;

    font-size:10px;
  }

  .settings-panel{

    top:61px;

    right:8px;

    width:
      min(335px,calc(100vw - 16px));

    max-height:
      calc(100vh - 70px);

    border-radius:16px;
  }

  .page-scrubber{

    top:54px;

    width:38px;
  }

  .scrubber{

    right:3px;

    width:6px;

    height:55vh;
  }

  .scrubber-thumb{

    width:6px;

    height:36px;
  }

  .scrubber-counter{

    right:14px;

    font-size:8px;
  }

  .bottom{

    bottom:8px;
  }
}


/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen .bar{

  display:none;
}

:fullscreen .reader{

  min-height:100vh;
}

:fullscreen .page-scrubber{

  top:0;
}

:fullscreen .settings-panel{

  top:14px;
}

:fullscreen .settings-backdrop{

  top:0;
}

</style>
</head>


<body>


<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="bar">


  <!-- HOME -->

  <div class="bar-right">

    <a
      href="index.html#chapters"
      class="home-btn"
      aria-label="العودة إلى الرئيسية"
    >

      <span class="home-icon">⌂</span>

      <span class="home-btn-text">
        الرئيسية
      </span>

    </a>

  </div>


  <!-- TITLE -->

  <div class="title">

    <span>
      بوروتو: دوامتان زرقاوتان
    </span>

    <b id="chapterTitle">
      جاري التحميل...
    </b>

  </div>


  <!-- READER CONTROLS -->

  <div class="bar-left">


    <button
      id="settingsBtn"
      class="settings-btn"
      aria-label="إعدادات القراءة"
      title="إعدادات القراءة"
    >
      ⚙
    </button>


    <div class="chapter-select-wrap">

      <select
        id="chaptersSelect"
        aria-label="اختيار الفصل"
      >

        <option value="">
          الفصول
        </option>

      </select>

    </div>


    <button
      id="full"
      class="full-btn"
      aria-label="ملء الشاشة"
      title="ملء الشاشة"
    >
      ⛶
    </button>


  </div>


</header>



<!-- =======================================================
     READER
======================================================= -->

<main
  id="reader"
  class="reader"
>

  <div class="status">

    جاري تحميل الصفحات...

  </div>

</main>



<!-- =======================================================
     SCRUBBER
======================================================= -->

<div class="page-scrubber">

  <div
    id="scrubberHitbox"
    class="scrubber-hitbox"
  >

    <div
      id="scrubber"
      class="scrubber"
    >

      <div
        id="scrubberThumb"
        class="scrubber-thumb"
      ></div>

    </div>


    <button
      id="scrubberTop"
      class="scrubber-top"
      aria-label="العودة إلى أول صفحة"
    >
      ↑
    </button>


    <button
      id="scrubberBottom"
      class="scrubber-bottom"
      aria-label="الانتقال إلى آخر صفحة"
    >
      ↓
    </button>


    <div
      id="scrubberCounter"
      class="scrubber-counter"
    >
      1 / 1
    </div>

  </div>

</div>



<!-- =======================================================
     SETTINGS BACKDROP
======================================================= -->

<div
  id="settingsBackdrop"
  class="settings-backdrop"
></div>



<!-- =======================================================
     SETTINGS PANEL
======================================================= -->

<div
  id="settingsPanel"
  class="settings-panel"
>


  <!-- HEADER -->

  <div class="settings-title">

    <div class="settings-heading">

      <div class="settings-heading-icon">
        ⚙
      </div>

      <div>

        <strong>
          إعدادات القراءة
        </strong>

        <small>
          خصّص تجربة القراءة كما تريد
        </small>

      </div>

    </div>


    <button
      id="closeSettings"
      class="settings-close"
      aria-label="إغلاق"
    >
      ×
    </button>

  </div>



  <!-- =====================================================
       DISPLAY
  ====================================================== -->

  <div class="settings-section">

    <div class="settings-section-title">
      العرض
    </div>


    <!-- MODE -->

    <div class="setting-row">

      <div class="setting-label">

        <div class="setting-label-icon">
          ▤
        </div>

        <span>
          طريقة العرض
        </span>

      </div>


      <div class="setting-actions">

        <button
          id="verticalBtn"
          class="active"
        >
          عمودي
        </button>

        <button
          id="singleBtn"
        >

/* =========================================================

const SUPABASE_URL =

  supabase.createClient(

/* =========================================================

========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function isUUID(value){

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(
      String(value || "").trim()
    );

}


function safeNumber(
  value,
  index
){

  const n =
    Number(value);

  if(
    Number.isFinite(n) &&
    n > 0
  ){

    return n;

  }

  return index + 1;

}


function publicUrl(path){

  if(!path){
    return "";
  }

  const clean =
    String(path)
      .split("/")
      .filter(Boolean)
      .map(
        encodeURIComponent
      )
      .join("/");

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/manga-pages/" +
    clean
  );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const reader =
    document.getElementById(
      "reader"
    );

  try{

    if(!requested){

      throw new Error(
        "معرّف الفصل غير موجود في الرابط."
      );

    }


    const chapterId =
      String(
        requested
      ).trim();


    let chapterResult;


    if(isUUID(chapterId)){

      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "id",
            chapterId
          )
          .maybeSingle();

    }else{

      const number =
        Number(
          chapterId
        );


      if(
        !Number.isInteger(number) ||
        number < 1
      ){

        throw new Error(
          "معرّف الفصل غير صالح."
        );

      }


      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "number",
            number
          )
          .maybeSingle();

    }


    if(chapterResult.error){

      throw new Error(
        "فشل قراءة الفصل: " +
        chapterResult.error.message
      );

    }


    if(!chapterResult.data){

      throw new Error(
        "لم يتم العثور على الفصل المطلوب."
      );

    }


    const chapter =
      chapterResult.data;


    const numberText =
      safeNumber(
        chapter.number,
        0
      );


    document
      .getElementById(
        "chapterTitle"
      )
      .textContent =
        `الفصل ${numberText} — ${chapter.title || ""}`;


    await loadChaptersDropdown(
      chapter.id
    );


    /* =====================================================
       LOAD PAGES
    ===================================================== */

    const pagesResult =
      await db
        .from("pages")
        .select(
          "id,page_number,storage_path"
        )
        .eq(
          "chapter_id",
          chapter.id
        )
        .order(
          "page_number",
          {
            ascending:true
          }
        );


    if(pagesResult.error){

      throw new Error(
        "تعذر قراءة الصفحات: " +
        pagesResult.error.message
      );

    }


    const pageRows =
      Array.isArray(
        pagesResult.data
      )
        ? pagesResult.data
        : [];


    if(!pageRows.length){

      throw new Error(
        "لا توجد صفحات مسجلة لهذا الفصل."
      );

    }


    images =
      pageRows
        .filter(
          p =>
            p &&
            p.storage_path
        )
        .map(
          (p,i) => ({

            page:
              safeNumber(
                p.page_number,
                i
              ),

            path:
              String(
                p.storage_path
              ),

            url:
              publicUrl(
                p.storage_path
              )

          })
        );


    if(!images.length){

      throw new Error(
        "مسارات الصور فارغة."
      );

    }


    images.sort(
      (a,b) =>
        a.page - b.page
    );


    render();

    updateScrubber();

  }catch(error){

    console.error(
      "Reader error:",
      error
    );


    reader.innerHTML = `

      <div class="status error">

        <h3>
          تعذر تحميل الفصل
        </h3>

        <div>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </div>

      </div>

    `;

  }

}


/* =========================================================
   CHAPTER DROPDOWN
========================================================= */

async function loadChaptersDropdown(
  currentId
){

  try{

    const {
      data
    } =
      await db
        .from("chapters")
        .select(
          "id,number,title"
        )
        .order(
          "number",
          {
            ascending:true
          }
        );


    if(!data){
      return;
    }


    const select =
      document.getElementById(
        "chaptersSelect"
      );


    select.innerHTML =
      '<option value="">الفصول</option>';


    data.forEach(
      ch => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          ch.id;


        option.textContent =
          `الفصل ${ch.number}`;


        if(
          ch.id === currentId
        ){

          option.selected =
            true;

        }


        select.appendChild(
          option
        );

      }
    );


    select.onchange =
      event => {

        if(
          event.target.value
        ){

          location.href =
            `?chapter=${encodeURIComponent(
              event.target.value
            )}`;

        }

      };

  }catch(error){

    console.error(
      "Chapters list error:",
      error
    );

  }

}


/* =========================================================

========================================================= */

function render(){

  const reader =
    document.getElementById(

  reader.innerHTML =

  images.forEach(

      img.alt =
        `صفحة ${page.page}`;


      img.loading =
        i < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.referrerPolicy =
        "no-referrer";


      img.dataset.pageIndex =
        String(i);


      img.onerror =
        () => {

          wrap.innerHTML = `

            <div class="status error">

              تعذر تحميل الصفحة
              ${escapeHtml(
                page.page
              )}

              <br>

              <small>
                المسار:
                ${escapeHtml(
                  page.path
                )}
              </small>

            </div>

          `;

        };


      wrap.appendChild(
        img
      );


      reader.appendChild(
        wrap
      );

    }
  );


  /* =====================================================
     CHAPTER END
  ===================================================== */

  const end =

  end.className =

  end.innerHTML = `

    .getElementById(

function setSingle(i){

  if(!images.length){
    return;
  }


  index =
    Math.max(
      0,
      Math.min(
        images.length - 1,
        i
      )
    );


  document
    .querySelectorAll(
      ".reader img"
    )
    .forEach(
      (img,n) => {

        img.classList.toggle(
          "active",
          n === index
        );

      }
    );


  document
    .getElementById(
      "counter"
    )
    .textContent =
      `${index + 1} / ${images.length}`;


  updateScrubber();

}

/* =========================================================
   SIDE SCRUBBER
========================================================= */

const scrubber =
  document.getElementById(
    "scrubber"
  );


const scrubberHitbox =
  document.getElementById(
    "scrubberHitbox"
  );


const scrubberThumb =
  document.getElementById(
    "scrubberThumb"
  );


const scrubberCounter =
  document.getElementById(
    "scrubberCounter"
  );


function updateScrubber(){

  if(!images.length){
    return;
  }


  let currentIndex =
    index;


  if(
    mode === "vertical"
  ){

    const maxScroll =
      document.documentElement
        .scrollHeight -
      window.innerHeight;


    if(
      maxScroll > 0
    ){

      const ratio =
        window.scrollY /
        maxScroll;


      currentIndex =
        Math.round(
          ratio *
          (images.length - 1)
        );

    }else{

      currentIndex =
        0;

    }

  }


  const ratio =
    images.length <= 1

      ? 0

      : currentIndex /
        (images.length - 1);


  const trackHeight =
    scrubber.clientHeight;


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const maxTop =
    Math.max(
      0,
      trackHeight -
      thumbHeight
    );


  scrubberThumb.style.top =
    `${ratio * maxTop}px`;


  scrubberCounter.textContent =
    `${currentIndex + 1} / ${images.length}`;

}


function activateScrubber(){

  scrubber
    .classList
    .add("active");


  clearTimeout(
    scrubberTimer
  );


  scrubberTimer =
    setTimeout(
      () => {

        if(
          !scrubberDragging
        ){

          scrubber
            .classList
            .remove("active");

        }

      },
      1800
    );

}


function seekFromPointer(
  clientY
){

  const rect =
    scrubber
      .getBoundingClientRect();


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const usable =
    Math.max(
      1,
      rect.height -
      thumbHeight
    );


  let y =
    clientY -
    rect.top -
    thumbHeight / 2;


  y =
    Math.max(
      0,
      Math.min(
        usable,
        y
      )
    );


  const ratio =
    y /
    usable;


  const target =
    Math.round(
      ratio *
      (images.length - 1)
    );


  if(
    mode === "single"
  ){

    setSingle(
      target
    );

  }else{

    const targetPage =
      document
        .querySelectorAll(
          ".page-wrap"
        )[target];


    if(targetPage){

      targetPage.scrollIntoView({

        behavior:"smooth",

        block:"start"

      });

    }

  }


  updateScrubber();

}


/* =========================================================
   SCRUBBER POINTER
========================================================= */

scrubberHitbox.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target ===

        ) ||

      event.target ===
        document.getElementById(
          "scrubberBottom"
        )
    ){

      return;

    }


    scrubberDragging =
      true;


    scrubber.setPointerCapture?.(
      event.pointerId
    );


    activateScrubber();


    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointermove",
  event => {

    if(
      !scrubberDragging
    ){

      return;

    }


    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointerup",
  () => {

    scrubberDragging =
      false;

    activateScrubber();

  }
);


scrubberHitbox.addEventListener(
  "pointercancel",
  () => {

    scrubberDragging =
      false;

  }
);


/* =========================================================
   SCRUBBER TOP / BOTTOM
========================================================= */

document
  .getElementById(
    "scrubberTop"
  )
  .onclick =
    event => {

      event.stopPropagation();


      if(
        mode === "single"
      ){

        setSingle(0);

      }else{

        window.scrollTo({

          top:0,

          behavior:"smooth"

        });

      }


      activateScrubber();

    };


document
  .getElementById(
    "scrubberBottom"
  )
  .onclick =
    event => {

      event.stopPropagation();


      if(
        mode === "single"
      ){

        setSingle(
          images.length - 1
        );

      }else{

        window.scrollTo({

          top:
            document
              .documentElement
              .scrollHeight,

          behavior:"smooth"

        });

      }


      activateScrubber();

    };


/* =========================================================
   SCROLL TRACKING
========================================================= */

let scrollTimer =
  null;


window.addEventListener(
  "scroll",
  () => {

    if(
      mode === "vertical"
    ){

      updateScrubber();

    }


    clearTimeout(
      scrollTimer
    );


    scrollTimer =
      setTimeout(
        () => {

          scrubber
            .classList
            .remove("active");

        },
        1200
      );

  },
  {
    passive:true
  }
);


window.addEventListener(
  "resize",
  updateScrubber
);


/* =========================================================
   EDGE ACTIVATION
========================================================= */

document.addEventListener(
  "pointermove",
  event => {

    if(
      event.clientX >
      window.innerWidth - 55
    ){

      activateScrubber();

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
  </html>
