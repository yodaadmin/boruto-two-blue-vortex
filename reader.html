<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c">
<title>قارئ الفصل — دوامتان زرقاوتان</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  overflow-x:hidden;
  transition:
    background .25s ease,
    color .25s ease;
}

a,
button,
input,
select{
  font:inherit;
}

/* =========================================================
   READING THEMES
========================================================= */

body.theme-black{
  --reader-bg:#05080c;
  --reader-panel:#09131b;
  --reader-border:#243943;
  --reader-text:#fff;
  --reader-muted:#91a5af;
}

body.theme-dark{
  --reader-bg:#101214;
  --reader-panel:#181b1e;
  --reader-border:#30363a;
  --reader-text:#f4f5f5;
  --reader-muted:#a5adb1;
}

body.theme-gray{
  --reader-bg:#202225;
  --reader-panel:#292c30;
  --reader-border:#42474b;
  --reader-text:#f7f7f7;
  --reader-muted:#b8bec2;
}

body{
  background:var(--reader-bg,#05080c);
}

/* =========================================================
   TOP BAR
========================================================= */

.bar{
  position:sticky;
  top:0;
  z-index:100;

  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:8px 14px;

  background:rgba(7,17,27,.92);
  border-bottom:1px solid #233746;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.bar a,
.bar button{
  color:#fff;
  text-decoration:none;

  background:#142532;
  border:1px solid rgba(255,255,255,.04);

  border-radius:10px;

  padding:8px 12px;

  cursor:pointer;

  transition:.2s ease;
}

.bar a:hover,
.bar button:hover{
  background:#1a3444;
}

.title{
  min-width:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:1px;

  text-align:center;
}

.title span{
  font-size:11px;
  color:#8fa4b1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  max-width:42vw;
}

.title b{
  font-size:14px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  max-width:42vw;
}

.controls{
  display:flex;
  gap:6px;
}

/* =========================================================
   FLOATING SETTINGS BUTTON
========================================================= */

.floating-settings{
  position:fixed;

  left:16px;
  bottom:18px;

  z-index:150;

  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  border:1px solid rgba(118,229,253,.18);
  border-radius:14px;

  color:#dff8ff;
  background:rgba(8,20,29,.9);

  box-shadow:
    0 12px 35px rgba(0,0,0,.35),
    0 0 25px rgba(19,171,210,.05);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  cursor:pointer;

  font-size:19px;

  transition:.2s ease;
}

.floating-settings:hover{
  background:#142d3a;
  border-color:rgba(118,229,253,.4);
  transform:translateY(-2px);
}

/* =========================================================
   READER
========================================================= */

.reader{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  min-height:calc(100vh - 60px);

  padding:0;
}

.page-wrap{
  width:100%;

  margin:0;
  padding:0;

  text-align:center;
  line-height:0;

  background:var(--reader-bg,#05080c);
}

.reader img{
  display:block;

  width:auto;
  max-width:100%;
  height:auto;

  margin:0 auto;
  padding:0;

  user-select:none;
  -webkit-user-drag:none;

  line-height:0;

  transition:
    filter .2s ease,
    width .2s ease;
}

/*
  القراءة العمودية:
  الصفحات ملتصقة تمامًا.
*/
.reader .page-wrap + .page-wrap{
  margin-top:0;
  padding-top:0;
}

body.fit-original .reader img{
  max-width:none;
}

/* =========================================================
   SINGLE PAGE
========================================================= */

body.single .reader img{
  display:none;
}

body.single .reader img.active{
  display:block;

  width:auto;
  max-width:100%;
  max-height:calc(100vh - 70px);

  object-fit:contain;

  margin:auto;
}

/* =========================================================
   PAGE SCALE
========================================================= */

body.scale-75 .reader img{
  width:75%;
}

body.scale-85 .reader img{
  width:85%;
}

body.scale-100 .reader img{
  width:100%;
}

body.scale-110 .reader img{
  width:110%;
  max-width:none;
}

body.scale-125 .reader img{
  width:125%;
  max-width:none;
}

body.single.scale-75 .reader img.active,
body.single.scale-85 .reader img.active,
body.single.scale-100 .reader img.active,
body.single.scale-110 .reader img.active,
body.single.scale-125 .reader img.active{
  width:auto;
  max-width:100%;
}

/* =========================================================
   IMAGE BRIGHTNESS
========================================================= */

body.brightness-80 .reader img{
  filter:brightness(.8);
}

body.brightness-90 .reader img{
  filter:brightness(.9);
}

body.brightness-100 .reader img{
  filter:brightness(1);
}

body.brightness-110 .reader img{
  filter:brightness(1.1);
}

body.brightness-120 .reader img{
  filter:brightness(1.2);
}

/* =========================================================
   STATUS
========================================================= */

.status{
  padding:40px 18px;

  text-align:center;

  color:#9fb2bf;

  max-width:900px;
}

.status.error{
  color:#ff9da8;
}

.status h3{
  margin:0 0 12px;
}

.status small{
  color:#8296a4;
  word-break:break-all;
}

/* =========================================================
   SETTINGS OVERLAY
========================================================= */

.settings-overlay{
  position:fixed;
  inset:0;

  z-index:119;

  background:rgba(0,0,0,.38);

  opacity:0;
  visibility:hidden;

  transition:.2s ease;
}

.settings-overlay.open{
  opacity:1;
  visibility:visible;
}

/* =========================================================
   SETTINGS PANEL
========================================================= */

.settings-panel{
  position:fixed;

  top:68px;
  right:14px;

  z-index:120;

  width:min(390px,calc(100vw - 28px));

  max-height:calc(100vh - 90px);

  overflow:auto;

  padding:17px;

  border:1px solid #294352;
  border-radius:20px;

  background:rgba(8,18,27,.97);

  box-shadow:
    0 25px 80px rgba(0,0,0,.6),
    0 0 30px rgba(19,171,210,.06);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  opacity:0;
  visibility:hidden;

  transform:translateY(-8px) scale(.98);

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;
}

.settings-panel.open{
  opacity:1;
  visibility:visible;

  transform:translateY(0) scale(1);
}

.settings-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;
}

.settings-title strong{
  font-size:15px;
}

.settings-title small{
  display:block;
  margin-top:3px;

  color:#718793;
  font-size:10px;
}

.settings-title button{
  width:31px;
  height:31px;

  border:0;
  border-radius:9px;

  color:#fff;
  background:#142532;

  cursor:pointer;
}

/* =========================================================
   SETTING SECTION
========================================================= */

.settings-section{
  padding-top:13px;
  margin-top:11px;

  border-top:1px solid rgba(255,255,255,.07);
}

.settings-section-title{
  color:#76e5fd;

  font-size:10px;
  font-weight:800;

  letter-spacing:.08em;

  margin-bottom:9px;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:10px 0;
}

.setting-row > span{
  font-size:12px;
  color:#b9c8cf;
}

.setting-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.setting-actions button{
  border:1px solid #263c49;

  background:#101f29;
  color:#dce8ed;

  border-radius:9px;

  padding:7px 9px;

  font-size:10px;

  cursor:pointer;

  transition:.18s ease;
}

.setting-actions button:hover{
  border-color:#397083;
}

.setting-actions button.active{
  background:#13abd2;
  color:#031015;
  border-color:#13abd2;
}

/* =========================================================
   RANGE
========================================================= */

.range-wrap{
  display:flex;
  align-items:center;
  gap:9px;

  width:170px;
}

.range-wrap output{
  min-width:34px;

  color:#76e5fd;

  font-size:10px;
  text-align:center;
}

.range-wrap input{
  width:100%;
  accent-color:#13abd2;
}

/* =========================================================
   RESET
========================================================= */

.reset-settings{
  width:100%;

  margin-top:14px;

  border:1px solid #334a56;

  background:#0e1d26;
  color:#cbd9de;

  border-radius:11px;

  padding:10px;

  cursor:pointer;

  font-size:11px;

  transition:.2s ease;
}

.reset-settings:hover{
  background:#152c38;
  border-color:#13abd2;
  color:#fff;
}

/* =========================================================
   SIDE SCRUBBER
========================================================= */

.page-scrubber{
  position:fixed;

  top:60px;
  right:0;
  bottom:0;

  z-index:90;

  width:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.scrubber-hitbox{
  position:absolute;

  top:0;
  right:0;
  bottom:0;

  width:38px;

  pointer-events:auto;
}

.scrubber{
  position:absolute;

  right:5px;

  width:8px;
  height:62vh;

  min-height:190px;
  max-height:680px;

  border-radius:999px;

  background:rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.035);

  opacity:.14;

  transition:
    opacity .2s ease,
    width .2s ease,
    background .2s ease;

  pointer-events:auto;

  cursor:pointer;

  box-shadow:
    0 0 15px rgba(0,0,0,.25);
}

.scrubber-hitbox:hover .scrubber,
.scrubber:hover,
.scrubber.active{
  opacity:.72;
  width:10px;

  background:rgba(19,171,210,.42);
}

.scrubber-thumb{
  position:absolute;

  left:50%;

  width:8px;
  height:44px;

  transform:translateX(-50%);

  border-radius:999px;

  background:#76e5fd;

  box-shadow:
    0 0 12px rgba(118,229,253,.4);

  transition:top .08s linear;

  pointer-events:none;
}

.scrubber-top,
.scrubber-bottom{
  position:absolute;

  right:-1px;

  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:rgba(9,20,29,.88);
  border:1px solid rgba(118,229,253,.18);

  color:#76e5fd;

  font-size:13px;

  opacity:0;

  transform:translateX(5px);

  transition:.2s ease;

  cursor:pointer;

  pointer-events:auto;
}

.scrubber-top{
  top:-40px;
}

.scrubber-bottom{
  bottom:-40px;
}

.scrubber-hitbox:hover .scrubber-top,
.scrubber-hitbox:hover .scrubber-bottom,
.scrubber.active ~ .scrubber-top,
.scrubber.active ~ .scrubber-bottom{
  opacity:1;
  transform:translateX(0);
}

.scrubber-counter{
  position:absolute;

  right:18px;

  top:50%;

  transform:translateY(-50%);

  padding:6px 9px;

  border-radius:8px;

  background:rgba(5,10,15,.9);
  border:1px solid rgba(118,229,253,.15);

  color:#dff8ff;

  font-size:10px;

  white-space:nowrap;

  opacity:0;
  pointer-events:none;

  transition:.2s ease;
}

.scrubber-hitbox:hover .scrubber-counter,
.scrubber.active ~ .scrubber-counter{
  opacity:1;
}

/* =========================================================
   CHAPTER END
========================================================= */

.chapter-end{
  width:min(760px,calc(100% - 28px));

  margin:55px auto 30px;

  padding:38px 24px;

  text-align:center;

  border:1px solid #243943;
  border-radius:22px;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(19,171,210,.12),
      transparent 65%
    ),
    var(--reader-panel,#09131b);

  box-shadow:
    0 25px 80px rgba(0,0,0,.35);
}

.chapter-end h2{
  margin:0 0 8px;

  font-size:23px;
}

.chapter-end p{
  margin:0 0 23px;

  color:var(--reader-muted,#91a5af);

  font-size:13px;
}

.chapter-navigation{
  display:grid;

  grid-template-columns:1fr auto 1fr;

  gap:9px;

  align-items:stretch;
}

.chapter-nav-btn{
  min-height:58px;

  border:1px solid #29414e;

  background:#122632;

  color:#fff;

  border-radius:12px;

  padding:9px 13px;

  cursor:pointer;

  transition:.2s ease;
}

.chapter-nav-btn:hover:not(:disabled){
  background:#13abd2;
  color:#031015;
  border-color:#13abd2;
}

.chapter-nav-btn:disabled{
  opacity:.4;
  cursor:default;
}

.chapter-nav-btn span{
  display:block;

  font-size:9px;

  color:#8fa7b2;

  margin-bottom:4px;
}

.chapter-nav-btn:hover:not(:disabled) span{
  color:#31515e;
}

.chapter-list-btn{
  min-height:58px;

  border:1px solid #29414e;

  background:#0d1d27;

  color:#dbe8ed;

  border-radius:12px;

  padding:9px 15px;

  cursor:pointer;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .bar{
    height:56px;
    padding:7px 9px;
  }

  .bar a,
  .bar button{
    padding:7px 9px;
  }

  .title span{
    max-width:30vw;
    font-size:9px;
  }

  .title b{
    max-width:30vw;
    font-size:12px;
  }

  .page-scrubber{
    top:56px;
    width:38px;
  }

  .scrubber{
    right:3px;
    width:7px;
    height:55vh;
  }

  .scrubber-thumb{
    width:7px;
    height:38px;
  }

  .scrubber-counter{
    right:15px;
  }

  .settings-panel{
    top:64px;
    right:8px;

    width:calc(100vw - 16px);

    max-height:calc(100vh - 76px);
  }

  .floating-settings{
    left:10px;
    bottom:10px;

    width:42px;
    height:42px;
  }

  .chapter-navigation{
    grid-template-columns:1fr;
  }

}

/* =========================================================
   FULLSCREEN
========================================================= */

/*
  الشريط العلوي يختفي في Full Screen،
  لكن زر الإعدادات العائم يبقى موجودًا.
*/

:fullscreen .bar{
  display:none;
}

:fullscreen .reader{
  min-height:100vh;
}

:fullscreen .page-scrubber{
  top:0;
}

:fullscreen .settings-panel{
  top:14px;
}

:fullscreen .floating-settings{
  left:16px;
  bottom:18px;
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition:none!important;
  }

}
</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function isUUID(value){

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(
      String(value || "").trim()
    );

}


function safeNumber(value,index){

  const n =
    Number(value);

  if(
    Number.isFinite(n) &&
    n > 0
  ){

    return n;

  }

  return index + 1;

}


function publicUrl(path){

  if(!path){
    return "";
  }

  const clean =
    String(path)
      .split("/")
      .filter(Boolean)
      .map(
        encodeURIComponent
      )
      .join("/");

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/manga-pages/" +
    clean
  );

}


/* =========================================================
   SETTINGS STORAGE
========================================================= */

function loadSettings(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "vortexReaderSettings"
        ) || "{}"
      );

    return {
      ...DEFAULT_SETTINGS,
      ...saved
    };

  }catch{

    return {
      ...DEFAULT_SETTINGS
    };

  }

}


function saveSettings(){

  try{

    localStorage.setItem(
      "vortexReaderSettings",
      JSON.stringify({

        mode,
        fit:
          document.body.classList.contains(
            "fit-original"
          )
            ? "original"
            : "fit",

        scale:
          getCurrentScale(),

        brightness:
          getCurrentBrightness(),

        theme:
          getCurrentTheme()

      })
    );

  }catch{}

}

function getCurrentTheme(){

/* =========================================================
   INIT
========================================================= */

async function init(){

  const reader =
    document.getElementById(
      "reader"
    );

  try{

    if(!requested){

      throw new Error(
        "معرّف الفصل غير موجود في الرابط."
      );

    }


    const chapterId =
      String(
        requested
      ).trim();


    let chapterResult;


    if(isUUID(chapterId)){

      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "id",
            chapterId
          )
          .maybeSingle();

    }else{

      const number =
        Number(
          chapterId
        );


      if(
        !Number.isInteger(number) ||
        number < 1
      ){

        throw new Error(
          "معرّف الفصل غير صالح."
        );

      }


      chapterResult =
        await db
          .from("chapters")
          .select(
            "id,number,title,published_at"
          )
          .eq(
            "number",
            number
          )
          .maybeSingle();

    }


    if(chapterResult.error){

      throw new Error(
        "فشل قراءة الفصل: " +
        chapterResult.error.message
      );

    }


    if(!chapterResult.data){

      throw new Error(
        "لم يتم العثور على الفصل المطلوب."
      );

    }


    currentChapter =
      chapterResult.data;


    const numberText =
      safeNumber(
        currentChapter.number,
        0
      );


    document
      .getElementById(
        "chapterTitle"
      )
      .textContent =
        `الفصل ${numberText} — ${currentChapter.title || ""}`;


    /* =====================================================
       LOAD PAGES
    ===================================================== */

    const pagesResult =
      await db
        .from("pages")
        .select(
          "id,page_number,storage_path"
        )
        .eq(
          "chapter_id",
          currentChapter.id
        )
        .order(
          "page_number",
          {
            ascending:true
          }
        );


    if(pagesResult.error){

      throw new Error(
        "تم العثور على الفصل، لكن تعذر قراءة الصفحات: " +
        pagesResult.error.message
      );

    }


    const pageRows =
      Array.isArray(
        pagesResult.data
      )
        ? pagesResult.data
        : [];


    if(!pageRows.length){

      throw new Error(
        "الفصل موجود، لكن لا توجد صفحات مسجلة له."
      );

    }


    images =
      pageRows
        .filter(
          p =>
            p &&
            p.storage_path
        )
        .map(
          (p,i) => ({

            page:
              safeNumber(
                p.page_number,
                i
              ),

            path:
              String(
                p.storage_path
              ),

            url:
              publicUrl(
                p.storage_path
              )

          })
        );


    if(!images.length){

      throw new Error(
        "تم العثور على الصفحات، لكن مسارات الصور فارغة."
      );

    }


    images.sort(
      (a,b) =>
        a.page - b.page
    );


    render();

    updateScrubber();

  }catch(error){

    console.error(
      "Reader error:",
      error
    );


    reader.innerHTML = `

      <div class="status error">

        <h3>
          تعذر تحميل الفصل
        </h3>

        <div>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </div>

      </div>

    `;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const reader =
    document.getElementById(
      "reader"
    );

  reader.innerHTML = "";


  images.forEach(
    (page,i) => {

      const wrap =
        document.createElement(
          "div"
        );


      wrap.className =
        "page-wrap";


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "manga-page";


      img.src =
        page.url;


      img.alt =
        `صفحة ${page.page}`;


      img.loading =
        i < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.referrerPolicy =
        "no-referrer";


      img.dataset.pageIndex =
        String(i);


      img.onerror =
        () => {

          wrap.innerHTML = `

            <div class="status error">

              تعذر تحميل الصفحة
              ${escapeHtml(
                page.page
              )}

              <br>

              <small>
                المسار:
                ${escapeHtml(
                  page.path
                )}
              </small>

            </div>

          `;

        };


      wrap.appendChild(
        img
      );

      reader.appendChild(
        wrap
      );

    }
  );


  createChapterEnd();


  document
    .getElementById(
      "counter"
    )?.remove();


  if(mode === "single"){

    setSingle(
      index
    );

  }

}

/* =========================================================
   ADJACENT CHAPTERS
========================================================= */

async function loadAdjacentChapters(){

  if(!currentChapter){
    return;
  }


  const currentNumber =
    Number(
      currentChapter.number
    );


  if(
    !Number.isFinite(
      currentNumber
    )
  ){

    setNoChapter(
      "previousChapter",
      "لا يوجد فصل سابق"
    );

    setNoChapter(
      "nextChapter",
      "لا يوجد فصل تالٍ"
    );

    return;

  }


  const result =
    await db
      .from("chapters")
      .select(
        "id,number,title"
      )
      .order(
        "number",
        {
          ascending:true
        }
      );


  if(result.error){

    console.error(
      "Adjacent chapters error:",
      result.error
    );

    return;

  }


  const chapters =
    Array.isArray(
      result.data
    )
      ? result.data
      : [];


  const previous =
    chapters
      .filter(
        chapter =>
          Number(
            chapter.number
          ) <
          currentNumber
      )
      .sort(
        (a,b) =>
          Number(b.number) -
          Number(a.number)
      )[0];


  const next =
    chapters
      .filter(
        chapter =>
          Number(
            chapter.number
          ) >
          currentNumber
      )
      .sort(
        (a,b) =>
          Number(a.number) -
          Number(b.number)
      )[0];


  const previousButton =
    document.getElementById(
      "previousChapter"
    );

  const nextButton =
    document.getElementById(
      "nextChapter"
    );


  if(previous){

    previousButton.innerHTML = `

      <span>
        الفصل السابق
      </span>

      الفصل ${escapeHtml(
        previous.number
      )}

    `;

    previousButton.disabled =
      false;

    previousButton.onclick = () => {

      location.href =
        `reader.html?chapter=${encodeURIComponent(
          previous.id
        )}`;

    };

  }else{

    setNoChapter(
      "previousChapter",
      "لا يوجد فصل سابق"
    );

  }


  if(next){

    nextButton.innerHTML = `

      <span>
        الفصل التالي
      </span>

      الفصل ${escapeHtml(
        next.number
      )}

    `;

    nextButton.disabled =
      false;

    nextButton.onclick = () => {

      location.href =
        `reader.html?chapter=${encodeURIComponent(
          next.id
        )}`;

    };

  }else{

    setNoChapter(
      "nextChapter",
      "لا يوجد فصل تالٍ"
    );

  }

}


function setNoChapter(

){

  const button =

  if(!button){

  button.innerHTML = `

}

/* =========================================================
   SIDE SCRUBBER
========================================================= */

const scrubber =
  document.getElementById(
    "scrubber"
  );

const scrubberHitbox =
  document.getElementById(
    "scrubberHitbox"
  );

const scrubberThumb =
  document.getElementById(
    "scrubberThumb"
  );

const scrubberCounter =
  document.getElementById(
    "scrubberCounter"
  );


function updateScrubber(){

  if(!images.length){
    return;
  }


  let currentIndex =
    index;


  if(mode === "vertical"){

    const maxScroll =
      document.documentElement
        .scrollHeight -
      window.innerHeight;


    if(maxScroll > 0){

      const ratio =
        window.scrollY /
        maxScroll;

      currentIndex =
        Math.round(
          ratio *
          (images.length - 1)
        );

    }else{

      currentIndex = 0;

    }

  }


  const ratio =
    images.length <= 1
      ? 0
      : currentIndex /
        (images.length - 1);


  const trackHeight =
    scrubber.clientHeight;


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const maxTop =
    Math.max(
      0,
      trackHeight -
      thumbHeight
    );


  scrubberThumb.style.top =
    `${ratio * maxTop}px`;


  scrubberCounter.textContent =
    `${currentIndex + 1} / ${images.length}`;

}


function activateScrubber(){

  scrubber.classList.add(
    "active"
  );

  clearTimeout(
    scrubberTimer
  );

  scrubberTimer =
    setTimeout(
      () => {

        if(!scrubberDragging){

          scrubber.classList.remove(
            "active"
          );

        }

      },
      1800
    );

}


function seekFromPointer(
  clientY
){

  if(!images.length){
    return;
  }


  const rect =
    scrubber.getBoundingClientRect();


  const thumbHeight =
    scrubberThumb.offsetHeight;


  const usable =
    Math.max(
      1,
      rect.height -
      thumbHeight
    );


  let y =
    clientY -
    rect.top -
    thumbHeight / 2;


  y =
    Math.max(
      0,
      Math.min(
        usable,
        y
      )
    );


  const ratio =
    y /
    usable;


  const target =
    Math.round(
      ratio *
      (images.length - 1)
    );


  if(mode === "single"){

    setSingle(
      target
    );

  }else{

    const targetPage =
      document.querySelectorAll(
        ".page-wrap"
      )[target];


    if(targetPage){

      targetPage.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  }


  updateScrubber();

}


/* =========================================================
   SCRUBBER POINTER
========================================================= */

scrubberHitbox.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target ===
        document.getElementById(
          "scrubberTop"
        ) ||
      event.target ===
        document.getElementById(
          "scrubberBottom"
        )
    ){

      return;

    }


    scrubberDragging =
      true;

    scrubber.setPointerCapture?.(
      event.pointerId
    );

    activateScrubber();

    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointermove",
  event => {

    if(!scrubberDragging){
      return;
    }

    seekFromPointer(
      event.clientY
    );

  }
);


scrubberHitbox.addEventListener(
  "pointerup",
  () => {

    scrubberDragging =
      false;

    activateScrubber();

  }
);


scrubberHitbox.addEventListener(
  "pointercancel",
  () => {

    scrubberDragging =
      false;

  }
);


/* =========================================================
   SCRUBBER TOP
========================================================= */

document
  .getElementById(
    "scrubberTop"
  )
  .onclick = event => {

    event.stopPropagation();

    if(mode === "single"){

      setSingle(
        0
      );

    }else{

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

    activateScrubber();

  };


/* =========================================================
   SCRUBBER BOTTOM
========================================================= */

document
  .getElementById(
    "scrubberBottom"
  )
  .onclick = event => {

    event.stopPropagation();

    if(mode === "single"){

      setSingle(
        images.length - 1
      );

    }else{

      window.scrollTo({
        top:
          document.documentElement
            .scrollHeight,
        behavior:"smooth"
      });

    }

    activateScrubber();

  };


/* =========================================================
   SCROLL TRACKING
========================================================= */

window.addEventListener(
  "scroll",
  () => {

    if(mode === "vertical"){

      updateScrubber();

    }

    clearTimeout(
      scrollTimer
    );

    scrollTimer =
      setTimeout(
        () => {

          scrubber.classList.remove(
            "active"
          );

        },
        1200
      );

  },
  {
    passive:true
  }
);


window.addEventListener(
  "resize",
  updateScrubber
);


/* =========================================================
   EDGE ACTIVATION
========================================================= */

document.addEventListener(
  "pointermove",
  event => {

    if(
      event.clientX >
      window.innerWidth - 55
    ){

      activateScrubber();

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      settingsPanel.classList.contains(
        "open"
      )
    ){

      closeSettings();

      return;

    }


    if(
      event.key === "f" ||
      event.key === "F"
    ){

      document
        .getElementById(
          "full"
        )
        .click();

    }


    if(
      event.key === "Escape"
    ){

      closeSettings();

    }

  }
);


/* =========================================================
   START
========================================================= */

initializeSettings();

init();

</script>

</body>
  </html>
