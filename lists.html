<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VORTEX — قوائم المانجا"
    >

    <title>VORTEX — القوائم</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/library.css"
    >

</head>

<body data-page="lists">

    <div id="app-header"></div>


    <main>

        <div class="container">


            <section class="page-title">

                <span class="eyebrow">
                    التنظيم
                </span>

                <h1>
                    القوائم
                </h1>

                <p>
                    نظّم الأعمال التي تتابعها داخل قوائم منفصلة.
                </p>

            </section>


            <section class="lists-layout">


                <aside class="lists-sidebar">

                    <div class="lists-sidebar-head">

                        <span class="eyebrow">
                            قوائمك
                        </span>

                        <button
                            type="button"
                            id="create-list"
                            class="btn primary"
                        >
                            + قائمة جديدة
                        </button>

                    </div>


                    <nav
                        id="lists-navigation"
                        class="lists-navigation"
                    ></nav>

                </aside>


                <section class="lists-content">

                    <div
                        id="list-header"
                        class="list-header"
                    >

                        <div>

                            <span
                                class="eyebrow"
                                id="list-label"
                            >
                                القائمة
                            </span>

                            <h2 id="list-title">
                                اختر قائمة
                            </h2>

                        </div>

                        <span
                            id="list-count"
                            class="results-count"
                        >
                            0 عمل
                        </span>

                    </div>


                    <div
                        id="list-results"
                        class="manga-grid"
                    ></div>


                    <div
                        id="list-empty"
                        class="empty"
                    >

                        <div class="empty-icon">
                            ≡
                        </div>

                        <h3>
                            اختر قائمة
                        </h3>

                        <p>
                            اختر إحدى القوائم من الجانب لعرض الأعمال الموجودة فيها.
                        </p>

                    </div>

                </section>

            </section>


        </div>

    </main>


    <div id="app-footer"></div>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const navigation =
                    document.getElementById(
                        "lists-navigation"
                    );

                const results =
                    document.getElementById(
                        "list-results"
                    );

                const empty =
                    document.getElementById(
                        "list-empty"
                    );

                const title =
                    document.getElementById(
                        "list-title"
                    );

                const label =
                    document.getElementById(
                        "list-label"
                    );

                const count =
                    document.getElementById(
                        "list-count"
                    );

                const createButton =
                    document.getElementById(
                        "create-list"
                    );


                const STORAGE_KEY =
                    "vortexLists";


                const DEFAULT_LISTS = [

                    {
                        id: "reading",
                        name: "أقرأ الآن"
                    },

                    {
                        id: "later",
                        name: "سأقرأ لاحقًا"
                    },

                    {
                        id: "completed",
                        name: "مكتملة"
                    }

                ];


                function getLists() {

                    try {

                        const saved =
                            JSON.parse(
                                localStorage.getItem(
                                    STORAGE_KEY
                                ) || "null"
                            );


                        if (
                            Array.isArray(saved)
                        ) {

                            return saved;

                        }

                    } catch {

                        // تجاهل البيانات التالفة
                    }


                    return DEFAULT_LISTS.map(
                        list => ({
                            ...list,
                            items: []
                        })
                    );

                }


                function saveLists(
                    lists
                ) {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(lists)
                    );

                }


                function normalizeLists() {

                    const lists =
                        getLists();


                    let changed = false;


                    DEFAULT_LISTS.forEach(
                        defaultList => {

                            const exists =
                                lists.some(
                                    list =>
                                        list.id ===
                                        defaultList.id
                                );


                            if (!exists) {

                                lists.push({
                                    ...defaultList,
                                    items: []
                                });

                                changed = true;

                            }

                        }
                    );


                    if (changed) {
                        saveLists(lists);
                    }


                    return lists;

                }


                function renderNavigation() {

                    const lists =
                        normalizeLists();


                    navigation.innerHTML =
                        "";


                    lists.forEach(
                        list => {

                            const items =
                                Array.isArray(
                                    list.items
                                )
                                    ? list.items
                                    : [];


                            const button =
                                document.createElement(
                                    "button"
                                );


                            button.type =
                                "button";


                            button.className =
                                "list-navigation-item";


                            button.dataset.id =
                                list.id;


                            button.innerHTML = `

                                <span>
                                    ${escapeHTML(
                                        list.name
                                    )}
                                </span>

                                <small>
                                    ${items.length}
                                </small>

                            `;


                            button.addEventListener(
                                "click",
                                () => {

                                    selectList(
                                        list.id
                                    );

                                }
                            );


                            navigation.appendChild(
                                button
                            );

                        }
                    );

                }


                function selectList(
                    listId
                ) {

                    const lists =
                        normalizeLists();


                    const list =
                        lists.find(
                            item =>
                                item.id ===
                                listId
                        );


                    if (!list) {
                        return;
                    }


                    document
                        .querySelectorAll(
                            ".list-navigation-item"
                        )
                        .forEach(
                            button => {

                                button.classList.toggle(
                                    "active",
                                    button.dataset.id ===
                                    listId
                                );

                            }
                        );


                    label.textContent =
                        "قائمة";


                    title.textContent =
                        list.name;


                    const items =
                        Array.isArray(
                            list.items
                        )
                            ? list.items
                            : [];


                    count.textContent =
                        `${items.length} عمل`;


                    results.innerHTML =
                        "";


                    if (!items.length) {

                        results.innerHTML =
                            "";


                        empty.classList.remove(
                            "hidden"
                        );


                        empty.querySelector(
                            "h3"
                        ).textContent =
                            "القائمة فارغة";


                        empty.querySelector(
                            "p"
                        ).textContent =
                            "لم تتم إضافة أي أعمال إلى هذه القائمة بعد.";


                        return;

                    }


                    empty.classList.add(
                        "hidden"
                    );


                    items.forEach(
                        item => {

                            const id =
                                item.id ||
                                item.manga_id ||
                                item.mangaId;


                            if (!id) {
                                return;
                            }


                            const mangaTitle =
                                item.title ||
                                item.name ||
                                "مانجا";


                            const cover =
                                item.cover ||
                                item.cover_url ||
                                item.image ||
                                "assets/boruto-cover.jpg";


                            const card =
                                document.createElement(
                                    "article"
                                );


                            card.className =
                                "manga-card";


                            card.innerHTML = `

                                <a
                                    href="manga.html?id=${encodeURIComponent(
                                        id
                                    )}"
                                    class="manga-cover"
                                >

                                    <img
                                        src="${escapeHTML(
                                            cover
                                        )}"
                                        alt="${escapeHTML(
                                            mangaTitle
                                        )}"
                                        loading="lazy"
                                    >

                                </a>


                                <div class="manga-card-body">

                                    <h3>

                                        <a
                                            href="manga.html?id=${encodeURIComponent(
                                                id
                                            )}"
                                        >
                                            ${escapeHTML(
                                                mangaTitle
                                            )}
                                        </a>

                                    </h3>


                                    <button
                                        type="button"
                                        class="text-button remove-list-item"
                                    >
                                        إزالة من القائمة
                                    </button>

                                </div>

                            `;


                            const removeButton =
                                card.querySelector(
                                    ".remove-list-item"
                                );


                            removeButton.addEventListener(
                                "click",
                                () => {

                                    removeFromList(
                                        listId,
                                        id
                                    );

                                }
                            );


                            results.appendChild(
                                card
                            );

                        }
                    );

                }


                function removeFromList(
                    listId,
                    mangaId
                ) {

                    const lists =
                        normalizeLists();


                    const list =
                        lists.find(
                            item =>
                                item.id ===
                                listId
                        );


                    if (!list) {
                        return;
                    }


                    list.items =
                        (
                            Array.isArray(
                                list.items
                            )
                                ? list.items
                                : []
                        ).filter(
                            item =>
                                String(
                                    item.id ||
                                    item.manga_id ||
                                    item.mangaId
                                ) !==
                                String(mangaId)
                        );


                    saveLists(lists);


                    renderNavigation();

                    selectList(listId);

                }


                createButton.addEventListener(
                    "click",
                    () => {

                        const name =
                            window.prompt(
                                "اكتب اسم القائمة الجديدة:"
                            );


                        if (!name) {
                            return;
                        }


                        const cleanName =
                            name.trim();


                        if (!cleanName) {
                            return;
                        }


                        const lists =
                            normalizeLists();


                        const id =
                            `list-${Date.now()}`;


                        lists.push({
                            id,
                            name: cleanName,
                            items: []
                        });


                        saveLists(lists);


                        renderNavigation();

                        selectList(id);

                    }
                );


                function escapeHTML(
                    value
                ) {

                    return String(
                        value ?? ""
                    )
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                renderNavigation();


                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const requestedList =
                    params.get("list");


                const lists =
                    normalizeLists();


                if (
                    requestedList &&
                    lists.some(
                        list =>
                            list.id ===
                            requestedList
                    )
                ) {

                    selectList(
                        requestedList
                    );

                } else {

                    selectList(
                        lists[0].id
                    );

                }

            }
        );

    </script>

</body>

</html>
