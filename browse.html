<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VORTEX GROUP — تصفح كل الأعمال">
    <title>VORTEX GROUP — تصفح الأعمال</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/browse.css">
</head>
<body data-page="browse">

    <div id="app-header"></div>

    <main>
        <div class="container">

            <div class="page-title">
                <span class="eyebrow">المكتبة</span>
                <h1>تصفح الأعمال</h1>
                <p>كل الأعمال المتوفرة، رتّبها وصفّها كما تريد.</p>
            </div>

            <div class="toolbar">
                <label class="tf">الترتيب<select id="f-sort"></select></label>
                <label class="tf">نوع العمل<select id="f-type"></select></label>
                <label class="tf">الحالة<select id="f-status"></select></label>
                <label class="tf">التصنيف<select id="f-genre"></select></label>
                <a class="btn secondary toolbar-adv" href="search.html">بحث متقدم</a>
            </div>

            <div class="results-header">
                <h2 id="results-title">كل الأعمال</h2>
                <div class="results-side">
                    <span id="count" class="results-count"></span>
                    <button id="clear" type="button" class="text-button hidden">مسح الفلاتر</button>
                </div>
            </div>

            <div id="results" class="manga-grid"></div>

            <div class="more-wrap">
                <button id="more" type="button" class="btn secondary hidden">تحميل المزيد</button>
            </div>

        </div>
    </main>

    <div id="app-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js"></script>
    <script src="js/taxonomy.js"></script>
    <script src="js/browse.js"></script>
</body>
</html>
